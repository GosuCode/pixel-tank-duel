// ---- Haunts: the browser fights back when you keep losing ----
const HAUNT_META = [
    { name: 'HAUNTED', desc: 'Tab title turns into taunts' },
    { name: 'CURSED', desc: 'Random beeps + blurry start' },
    { name: 'POSSESSED', desc: 'Window shrinks, controls scramble' },
    { name: 'HEXED', desc: 'Notification spam + screen inversion' },
    { name: 'DAMNED', desc: 'Everything, plus a webcam request' },
];
const ORIG_TITLE = document.title;
let hauntActive = false;
let hauntTimers = [];
let hauntConsumedThisRound = false;
let scrambleUntil = 0;
let scrambleFlip = 1;

function clearHauntFx() {
    for (const t of hauntTimers) { clearInterval(t); }
    hauntTimers = [];
    document.title = ORIG_TITLE;
    document.body.classList.remove('hauntInvert', 'blurStart');
    scrambleUntil = 0;
    if (hauntTagEl) hauntTagEl.classList.remove('on');
    hauntActive = false;
}

function toggleInversion(count) {
    let i = 0;
    const togg = setInterval(() => {
        document.body.classList.toggle('hauntInvert');
        i++;
        if (i >= count * 2) { document.body.classList.remove('hauntInvert'); clearInterval(togg); }
    }, 400);
    hauntTimers.push(togg);
}

function hauntBeeps() {
    const beep = setInterval(() => {
        if (audioCtx) tone(380 + Math.random() * 400, audioCtx.currentTime + 0.01, 0.06, 'square', 0.05);
    }, 5000 + Math.random() * 10000);
    hauntTimers.push(beep);
}

function hauntTitle() {
    const lines = ['REKT', 'GIT GUD', 'MOM HELP', 'TOO SLOW', 'U WOT', 'GG EZ'];
    let li = 0;
    const tim = setInterval(() => { document.title = lines[li++ % lines.length]; }, 2000);
    hauntTimers.push(tim);
}

function hauntShrink() {
    try {
        if (window.resizeTo && window.outerWidth) {
            window.resizeTo(Math.max(480, window.outerWidth - 30), Math.max(360, window.outerHeight - 30));
        }
    } catch (e) {}
}

function hauntNotify() {
    try {
        if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }
        if ('Notification' in window && Notification.permission === 'granted') {
            ['DEFEATED', 'AGAIN?', 'GIVE UP?', 'NICE TRY'].forEach((m, i) =>
                setTimeout(() => { try { new Notification('Pixel Tank Duel', { body: m }); } catch (e) {} }, i * 600));
        }
    } catch (e) {}
}

function hauntCamera() {
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: true }).then((s) => {
                setTimeout(() => s.getTracks().forEach((t) => t.stop()), 1200);
            }).catch(() => {});
        }
    } catch (e) {}
}

function startScramble() {
    scrambleUntil = performance.now() + 10000;
    scrambleFlip = 1;
    const togg = setInterval(() => {
        if (performance.now() >= scrambleUntil) { clearInterval(togg); scrambleFlip = 1; return; }
        scrambleFlip *= -1;
    }, 3200);
    hauntTimers.push(togg);
}

function applyHaunt(level, immune) {
    clearHauntFx();
    if (level <= 0) return;
    if (immune) {
        hauntTagEl.textContent = 'HAUNT BLOCKED';
        hauntTagEl.classList.add('on');
        setTimeout(() => hauntTagEl.classList.remove('on'), 2600);
        return;
    }
    hauntActive = true;
    const lv = Math.min(5, level);
    hauntTagEl.textContent = HAUNT_META[lv - 1].name;
    hauntTagEl.classList.add('on');
    if (lv >= 1) hauntTitle();
    if (lv >= 2) {
        hauntBeeps();
        document.body.classList.add('blurStart');
        setTimeout(() => document.body.classList.remove('blurStart'), 3000);
    }
    if (lv >= 3) { hauntShrink(); startScramble(); }
    if (lv >= 4) { hauntNotify(); toggleInversion(3); }
    if (lv >= 5) hauntCamera();
    boltNote(`HAUNTED · ${HAUNT_META[lv - 1].desc}`, 'atk');
}

// ---- Rendering ----
function wrapText(g, text, maxW) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (g.measureText(test).width > maxW && line) { lines.push(line); line = word; }
        else line = test;
    }
    if (line) lines.push(line);
    return lines;
}

function drawTauntBubble(p, text, age) {
    ctx.save();
    ctx.font = 'bold 12px ui-monospace, monospace';
    const lines = wrapText(ctx, text, 130);
    const lineH = 15;
    let maxW = 0;
    for (const l of lines) maxW = Math.max(maxW, ctx.measureText(l).width);
    const w = maxW + 18;
    const h = lines.length * lineH + 12;
    const anchorX = Math.max(w / 2 + 6, Math.min(canvas.width - w / 2 - 6, p.x));
    const anchorY = p.y - 40 - h;
    const accent = p.design ? p.design.color : '#e0a938';

    // pop in, then a springy wobble for ~0.8s
    const appear = Math.min(1, age / 0.16);
    const overshoot = age < 0.16 ? 1.22 : 1;
    const scale = (0.35 + 0.65 * appear) * overshoot;
    const wob = age < 0.8 ? Math.sin(age * 26) * (1 - age / 0.8) * 0.14 : 0;

    ctx.translate(anchorX, anchorY + h); // pivot on the tail tip
    ctx.rotate(wob);
    ctx.scale(scale, scale);
    ctx.translate(0, -h); // origin now top-left of the bubble

    roundRect(ctx, 0, 0, w, h, 6);
    ctx.fillStyle = 'rgba(19,21,15,0.95)';
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(w / 2 - 6, h - 1);
    ctx.lineTo(w / 2 + 6, h - 1);
    ctx.lineTo(w / 2, h + 9);
    ctx.closePath();
    ctx.fillStyle = 'rgba(19,21,15,0.95)';
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#f0ecd8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], w / 2, 6 + lineH * i + lineH / 2);
    }
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
}

function drawHealthBar(x, topY, hp, maxHp) {
    const segW = 10;
    const gap = 2;
    const h = 5;
    const total = maxHp * segW + (maxHp - 1) * gap;
    const left = x - total / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, left - 2, topY - 2, total + 4, h + 4, 2.5);
    ctx.fill();
    const fillColor = hp >= maxHp ? '#2ECC40' : hp === 1 ? '#c14b32' : '#e0a938';
    for (let i = 0; i < maxHp; i++) {
        const sx = left + i * (segW + gap);
        ctx.fillStyle = i < hp ? fillColor : 'rgba(255,255,255,0.13)';
        roundRect(ctx, sx, topY, segW, h, 1.5);
        ctx.fill();
    }
}

function mulberry32(a) {
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function drawExplosion(anim, age) {
    const p = Math.min(1, age / 0.9);
    const rnd = mulberry32((anim.seed * 2654435761) >>> 0);
    ctx.save();
    ctx.translate(anim.x, anim.y);

    // expanding shockwave ring
    ctx.beginPath();
    ctx.arc(0, 0, 8 + p * 54, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,214,120,${(1 - p) * 0.9})`;
    ctx.lineWidth = 3 * (1 - p) + 0.5;
    ctx.stroke();

    // fireball core
    const fbR = 20 * (1 - p * 0.55);
    if (fbR > 0.5) {
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, fbR);
        grad.addColorStop(0, `rgba(255,255,225,${(1 - p) * 0.95})`);
        grad.addColorStop(0.45, `rgba(255,168,58,${(1 - p) * 0.85})`);
        grad.addColorStop(1, 'rgba(180,40,20,0)');
        ctx.beginPath();
        ctx.arc(0, 0, fbR, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
    }

    // flying debris
    for (let i = 0; i < 12; i++) {
        const a = rnd() * Math.PI * 2;
        const spd = 40 + rnd() * 90;
        const life = 1 - age / (0.5 + rnd() * 0.4);
        const size = 2 + rnd() * 3;
        const spin = (2 + rnd() * 6) * (rnd() < 0.5 ? -1 : 1);
        const shadePick = i % 3;
        if (life <= 0) continue;
        ctx.save();
        ctx.translate(Math.cos(a) * spd * age, Math.sin(a) * spd * age + 90 * age * age);
        ctx.rotate(age * spin);
        ctx.globalAlpha = Math.max(0, life);
        ctx.fillStyle = shadePick === 0 ? '#2b2f22' : shadePick === 1 ? anim.color : '#c9c3aa';
        ctx.fillRect(-size / 2, -size / 2, size, size);
        ctx.restore();
    }

    // purchased kill effects layered on top of the base explosion
    if (anim.boom === 'boom_confetti' && p > 0.1) {
        for (let i = 0; i < 26; i++) {
            const a = rnd() * Math.PI * 2;
            const spd = 60 + rnd() * 110;
            const life = 1 - age / (0.6 + rnd() * 0.4);
            if (life <= 0) continue;
            ctx.fillStyle = hexA(['#ffd600', '#ff1744', '#2979ff', '#00e5ff', '#b388ff'][i % 5], life);
            ctx.fillRect(Math.cos(a) * spd * age - 2, Math.sin(a) * spd * age - 2, 4, 4);
        }
    } else if (anim.boom === 'boom_comets') {
        for (let i = 0; i < 10; i++) {
            const a = rnd() * Math.PI * 2;
            const r1 = 26 + i * 2;
            ctx.strokeStyle = hexA('#40c4ff', (1 - p) * 0.8);
            ctx.lineWidth = 2 * (1 - p) + 0.4;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            ctx.lineTo(Math.cos(a) * (r1 + 46 * (1 - p)), Math.sin(a) * (r1 + 46 * (1 - p)));
            ctx.stroke();
        }
    } else if (anim.boom === 'boom_skull') {
        const r0 = 9 + p * 26;
        ctx.fillStyle = hexA('#263238', (1 - p) * 0.9);
        ctx.beginPath(); ctx.arc(0, -6 * p, r0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-8, 2, r0 * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, 2, r0 * 0.7, 0, Math.PI * 2); ctx.fill();
        if (p < 0.6) {
            ctx.fillStyle = '#dcedc8';
            ctx.fillRect(-9 + 1, -3, 4, 5);
            ctx.fillRect(5 + 1, -3, 4, 5);
            ctx.fillRect(-1, 1, 2, 3);
        }
    }
    ctx.restore();
}

function drawSpawnAnim(x, y, age, spawnId) {
    const p = Math.min(1, age / 0.9);
    if (p <= 0 || p >= 1) return;
    ctx.save();
    ctx.translate(x, y);
    if (spawnId === 'spawn_portal') {
        const a = age * 4;
        ctx.rotate(a);
        ctx.strokeStyle = hexA('#b388ff', 1 - p);
        ctx.lineWidth = 2;
        const s = 16 * (1 - p * 0.3);
        ctx.strokeRect(-s, -s, s * 2, s * 2);
        ctx.rotate(-a * 2);
        ctx.strokeStyle = hexA('#00e5ff', 1 - p);
        ctx.lineWidth = 1.4;
        const s2 = 11 * (1 - p * 0.3);
        ctx.strokeRect(-s2, -s2, s2 * 2, s2 * 2);
    } else if (spawnId === 'spawn_sky') {
        ctx.fillStyle = hexA('#aeea00', (1 - p) * 0.5);
        ctx.beginPath();
        ctx.ellipse(0, 8 + p * 10, 16 * (1 - p * 0.3), 5 * (1 - p * 0.3), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = hexA('#f4ff81', 1 - p);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -10); ctx.lineTo(0, -30 - p * 24);
        ctx.stroke();
    } else {
        // smoke reveal (and default fallback)
        for (let i = 0; i < 5; i++) {
            const a = (Math.PI * 2 / 5) * i + age * 1.5;
            const r = 14 + p * 18;
            ctx.fillStyle = hexA('#cfd8dc', (1 - p) * 0.4);
            ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 5 * (1 - p) + 1, 0, Math.PI * 2); ctx.fill();
        }
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // screen shake when we take a hit
    const nowMs = performance.now();
    let shakeX = 0, shakeY = 0;
    if (nowMs < shakeUntil) {
        const k = Math.min(1, (shakeUntil - nowMs) / shakeDur);
        shakeX = (Math.random() - 0.5) * 2 * shakeMag * k;
        shakeY = (Math.random() - 0.5) * 2 * shakeMag * k;
    } else {
        shakeMag = 0;
    }
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // red edge vignette while the hurt flash is fresh
    const hurtAge = nowMs - hurtFlashAt;
    hurtVignetteEl.style.opacity = hurtAge < 400 ? String(Math.max(0, 1 - hurtAge / 400) * 0.9) : '0';

    ctx.strokeStyle = 'rgba(127,138,82,0.07)';
    ctx.lineWidth = 1;
    const grid = 40;
    ctx.beginPath();
    for (let x = grid; x < canvas.width; x += grid) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, canvas.height);
    }
    for (let y = grid; y < canvas.height; y += grid) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(canvas.width, y + 0.5);
    }
    ctx.stroke();

    for (const o of obstacles) {
        roundRect(ctx, o.x, o.y, o.w, o.h, Math.min(4, o.w / 2, o.h / 2));
        ctx.fillStyle = '#242819';
        ctx.fill();
        ctx.strokeStyle = '#3b4129';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    if (holes.length) {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        for (const h of holes) {
            ctx.beginPath();
            ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    if (powerup) {
        const meta = POWERUP_META[powerup.type];
        const pulse = 3 * Math.sin(Date.now() / 150);
        ctx.beginPath();
        ctx.arc(powerup.x, powerup.y, 14 + pulse, 0, Math.PI * 2);
        ctx.fillStyle = meta.color;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#111';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(meta.label, powerup.x, powerup.y + 1);
        ctx.textBaseline = 'alphabetic';
    } else if (powerupNext) {
        // announced next spawn: a pulsing ring at the spot + a countdown
        const meta = POWERUP_META[powerupNext.type];
        const pulse = 2 * Math.sin(Date.now() / 140);
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = meta.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(powerupNext.x, powerupNext.y, 15 + pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = meta.color;
        ctx.font = 'bold 10px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(powerupNext.timeLeft / 1000) + 's', powerupNext.x, powerupNext.y - 22);
        ctx.restore();
    }

    for (const b of bullets) {
        if (b.laser) {
            const len = Math.hypot(b.vx, b.vy) || 1;
            const tx = b.x - (b.vx / len) * 26;
            const ty = b.y - (b.vy / len) * 26;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(255,23,68,0.35)';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            ctx.strokeStyle = '#ff1744';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            continue;
        }
        const ownP = b.owner ? players[b.owner] : null;
        const trailId = ownP && ownP.design ? ownP.design.trail : null;
        if (trailId) {
            const tc = shopColor(trailId);
            const len = Math.hypot(b.vx, b.vy) || 1;
            const tx = b.x - (b.vx / len) * 18;
            const ty = b.y - (b.vy / len) * 18;
            ctx.save();
            ctx.lineCap = 'round';
            ctx.strokeStyle = hexA(tc, 0.28);
            ctx.lineWidth = 7;
            ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
            ctx.strokeStyle = hexA(tc, 0.85);
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(b.x, b.y); ctx.stroke();
            if (trailId === 'trail_rainbow') {
                ctx.strokeStyle = hexA('#ffd600', 0.55);
                ctx.lineWidth = 1.4;
                ctx.beginPath(); ctx.moveTo(tx + 3, ty - 3); ctx.lineTo(b.x, b.y); ctx.stroke();
            }
            if (trailId === 'trail_spark') {
                ctx.fillStyle = hexA('#fff', 0.9);
                for (let i = 0; i < 3; i++) ctx.fillRect(tx + i * 3 - 1, ty - 1, 2, 2);
            }
            ctx.restore();
        }
        // Tank shell: elongated metal round, pointed nose, hot exhaust tail.
        const ang = Math.atan2(b.vy, b.vx);
        const shellLen = b.hot ? 15 : 13;
        const shellW = b.hot ? 3.4 : 3;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(ang);
        ctx.fillStyle = b.hot ? 'rgba(255,196,0,0.85)' : 'rgba(255,150,60,0.7)';
        ctx.beginPath();
        ctx.moveTo(-shellLen * 0.5, 0);
        ctx.lineTo(-shellLen * 0.5 - 6, -2.4);
        ctx.lineTo(-shellLen * 0.5 - 6, 2.4);
        ctx.closePath();
        ctx.fill();
        const shellGrad = ctx.createLinearGradient(0, -shellW, 0, shellW);
        shellGrad.addColorStop(0, '#f4f6f8');
        shellGrad.addColorStop(0.45, '#aab2ba');
        shellGrad.addColorStop(1, '#5b6169');
        ctx.fillStyle = b.hot ? '#ffd600' : shellGrad;
        ctx.beginPath();
        ctx.moveTo(shellLen * 0.62, 0);
        ctx.lineTo(shellLen * 0.12, -shellW);
        ctx.lineTo(-shellLen * 0.5, -shellW);
        ctx.quadraticCurveTo(-shellLen * 0.62, 0, -shellLen * 0.5, shellW);
        ctx.lineTo(shellLen * 0.12, shellW);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(20,24,28,0.85)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        ctx.fillStyle = 'rgba(196,150,60,0.9)';
        ctx.fillRect(-shellLen * 0.42, -shellW, 1.6, shellW * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(shellLen * 0.16, 0, shellW * 0.34, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Floor marker under your own tank (drawn before tanks so it sits on the ground)
    const mine = myId ? players[myId] : null;
    if (mine && mine.alive) {
        const accent = (mine.design && mine.design.color) || '#e0a938';
        const ringR = 24 + 2 * Math.sin(performance.now() / 260);
        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(mine.x, mine.y, ringR + 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(mine.x, mine.y, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(mine.x, mine.y, ringR + 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // aim reticle (independent-aim mode only)
        if (controlMode === 'aim') {
            const aim = mine.aim || 0;
            const rx = mine.x + Math.cos(aim) * 62;
            const ry = mine.y + Math.sin(aim) * 62;
            ctx.save();
            ctx.globalAlpha = 0.55;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(rx, ry, 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(rx - 8, ry); ctx.lineTo(rx - 3, ry);
            ctx.moveTo(rx + 3, ry); ctx.lineTo(rx + 8, ry);
            ctx.moveTo(rx, ry - 8); ctx.lineTo(rx, ry - 3);
            ctx.moveTo(rx, ry + 3); ctx.lineTo(rx, ry + 8);
            ctx.stroke();
            ctx.restore();
        }

        // hitmarker: four ticks around your tank when a shot connects
        const hmAge = performance.now() - hitMark.start;
        if (hmAge < 140) {
            const k = 1 - hmAge / 140;
            const r1 = 25 + (1 - k) * 7;
            const r2 = r1 + 8;
            ctx.save();
            ctx.globalAlpha = k;
            ctx.strokeStyle = hitMark.kill ? '#ffd600' : '#ffffff';
            ctx.lineWidth = hitMark.kill ? 3 : 2;
            for (const a of [Math.PI / 4, (3 * Math.PI) / 4, (5 * Math.PI) / 4, (7 * Math.PI) / 4]) {
                ctx.beginPath();
                ctx.moveTo(mine.x + Math.cos(a) * r1, mine.y + Math.sin(a) * r1);
                ctx.lineTo(mine.x + Math.cos(a) * r2, mine.y + Math.sin(a) * r2);
                ctx.stroke();
            }
            ctx.restore();
        }
    }

    for (const id in players) {
        const p = players[id];
        if (!p.alive) continue;

        if (p.buff && p.buff.type === 'shield') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
            ctx.strokeStyle = '#2979ff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.7;
            ctx.stroke();
            ctx.fillStyle = '#2979ff';
            ctx.globalAlpha = 0.12;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        if (p.spawnProtected) {
            const pulse = 1.5 * Math.sin(performance.now() / 90);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 20 + pulse, 0, Math.PI * 2);
            ctx.strokeStyle = '#e6f7ff';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.6;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        const kickAt = barrelKick[id];
        const kickMax = p.buff && p.buff.type === 'triple' ? 10 : p.buff && p.buff.type === 'laser' ? 6 : 4;
        const kick = kickAt ? Math.max(0, 1 - (performance.now() - kickAt) / 130) * kickMax : 0;
        drawTank(ctx, p.design || DEFAULT_DESIGN, (p.aim || 0) - p.angle, streakSkinFor(p.best), kick);
        ctx.restore();

        // brief white flash when this tank takes a hit
        const flashAge = hitFlash[id] ? performance.now() - hitFlash[id] : Infinity;
        if (flashAge < 160) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.globalAlpha = 0.65 * (1 - flashAge / 160);
            ctx.fillStyle = '#fff';
            hullPath(ctx, (p.design || DEFAULT_DESIGN).hull);
            ctx.fill();
            ctx.restore();
        }

        drawHealthBar(p.x, p.y - 22, p.hp, p.maxHp || 3);

        const label = (p.design && p.design.name) || '';
        ctx.textAlign = 'center';
        if (label) {
            ctx.fillStyle = p.design.color;
            ctx.font = 'bold 11px ui-monospace, monospace';
            ctx.fillText(label, p.x, p.y - 34);
        }
        const starY = label ? p.y - 46 : p.y - 34;
        ctx.fillStyle = '#e0a938';
        ctx.font = '11px ui-monospace, monospace';
        ctx.fillText(`★${p.kills}`, p.x, starY);

        if (p.buff) {
            const meta = POWERUP_META[p.buff.type];
            ctx.beginPath();
            ctx.arc(p.x, starY - 12, 8, 0, Math.PI * 2);
            ctx.fillStyle = meta.color;
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.font = 'bold 9px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(meta.label, p.x, starY - 11);
            ctx.textBaseline = 'alphabetic';
        }

        if (p.taunt && tauntAnims[id]) {
            const age = (performance.now() - tauntAnims[id].start) / 1000;
            drawTauntBubble(p, p.taunt.text, age);
        }
    }

    // Muzzle flashes from cannon fire (transient, drawn over the tanks)
    for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
        const mf = muzzleFlashes[i];
        const age = nowMs - mf.start;
        if (age > 130) { muzzleFlashes.splice(i, 1); continue; }
        const k = 1 - age / 130;
        ctx.save();
        ctx.translate(mf.x, mf.y);
        ctx.rotate(mf.angle);
        ctx.globalAlpha = k;
        const flame = ctx.createRadialGradient(0, 0, 0, 0, 0, 16);
        flame.addColorStop(0, 'rgba(255,255,220,0.95)');
        flame.addColorStop(0.4, 'rgba(255,170,40,0.8)');
        flame.addColorStop(1, 'rgba(255,80,0,0)');
        ctx.fillStyle = flame;
        ctx.beginPath();
        ctx.arc(0, 0, 16 * (0.6 + k * 0.4), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,235,180,0.9)';
        ctx.beginPath();
        ctx.moveTo(2, 0);
        ctx.lineTo(16 * (0.5 + k), -4);
        ctx.lineTo(16 * (0.5 + k), 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // Round-start "find yourself" cue on your own tank, first 1.5s only
    if (mine && mine.alive && roundActiveStart) {
        const sinceStart = performance.now() - roundActiveStart;
        if (sinceStart < 1500) {
            const t = sinceStart / 1500;
            const accent = (mine.design && mine.design.color) || '#e0a938';
            ctx.save();
            ctx.globalAlpha = (1 - t) * 0.8;
            ctx.strokeStyle = accent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mine.x, mine.y, 24 + t * 50, 0, Math.PI * 2);
            ctx.stroke();
            const ay = mine.y - 44 + Math.sin(performance.now() / 120) * 4 - t * 10;
            ctx.globalAlpha = (1 - t) * 0.95;
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.moveTo(mine.x - 9, ay);
            ctx.lineTo(mine.x + 9, ay);
            ctx.lineTo(mine.x, ay + 12);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }
    }

    // purchased spawn animation on your own entrance
    if (mine && mine.alive && ownSpawnStart) {
        const soAge = (performance.now() - ownSpawnStart) / 1000;
        if (soAge < 0.9 && design.spawn) drawSpawnAnim(mine.x, mine.y, soAge, design.spawn);
    }

    for (const id in boomAnims) {
        const anim = boomAnims[id];
        drawExplosion(anim, (performance.now() - anim.start) / 1000);
    }

    // floating damage numbers
    for (let i = damageNumbers.length - 1; i >= 0; i--) {
        const dn = damageNumbers[i];
        const age = (performance.now() - dn.start) / 1000;
        if (age > 0.7) { damageNumbers.splice(i, 1); continue; }
        const y = dn.y - 30 - age * 26;
        ctx.globalAlpha = 1 - age / 0.7;
        ctx.font = 'bold 13px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
        ctx.strokeText(dn.text, dn.x, y);
        ctx.fillStyle = dn.color;
        ctx.fillText(dn.text, dn.x, y);
        ctx.globalAlpha = 1;
    }

    ctx.restore();
    requestAnimationFrame(draw);
}
draw();

// ---- HUD ----
setInterval(() => {
    const alive = Object.values(players).filter((p) => p.alive).length;
    const total = Object.keys(players).length;

    const mine = myId ? players[myId] : null;
    if (playerCountEl) playerCountEl.textContent = `Players ${total}/${MAX_PLAYERS}`;
    if (boltsEl) {
        const lv = mine ? (mine.hauntLevel || 0) : (bankInfo.hauntLevel || 0);
        boltsEl.classList.toggle('haunted', lv > 0);
        const bal = mine && mine.bolts != null ? mine.bolts : bankInfo.bolts;
        boltsEl.textContent = `⚡ ${bal}${lv ? ` · ${lv}` : ''}${mine && (mine.streak || 0) >= 2 ? ` · ${mine.streak}W` : ''}`;
    }
    if (mine && mine.buff) {
        const meta = POWERUP_META[mine.buff.type];
        myBuffEl.textContent = `${meta.name} ${Math.ceil(mine.buff.timeLeft / 1000)}s`;
        myBuffEl.style.color = meta.color;
    } else {
        myBuffEl.textContent = '';
    }

    if (matchInfo.roundNumber > 0 || matchInfo.over) {
        seriesEl.textContent = matchInfo.over
            ? matchInfo.winnerText
            : `Round ${matchInfo.roundNumber} · first to ${matchInfo.targetWins}`;
    } else {
        seriesEl.textContent = `First to ${matchInfo.targetWins}`;
    }

    if (roundInfo.state === 'countdown') {
        timerEl.textContent = Math.ceil(roundInfo.countdownLeft / 1000) + 's';
        statusEl.textContent = 'Get ready';
        bannerEl.textContent = 'GET READY\n' + Math.ceil(roundInfo.countdownLeft / 1000);
    } else if (roundInfo.state === 'active') {
        timerEl.textContent = Math.ceil(roundInfo.timeLeft / 1000) + 's';
        statusEl.textContent = mapName ? `${mapName} · ${alive}/${total} alive` : `${alive}/${total} alive`;
        bannerEl.textContent = '';
    } else if (roundInfo.state === 'sudden') {
        timerEl.textContent = Math.ceil(roundInfo.timeLeft / 1000) + 's';
        statusEl.textContent = 'next kill wins';
        bannerEl.textContent = 'SUDDEN DEATH';
    } else if (roundInfo.state === 'ended') {
        timerEl.textContent = '';
        statusEl.textContent = '';
        bannerEl.textContent = matchInfo.over
            ? matchInfo.winnerText + '\nNew match soon...'
            : roundInfo.winnerText + '\nNext round soon...';
    } else {
        timerEl.textContent = '';
        statusEl.textContent = total < 2 ? 'Waiting for another player...' : '';
        bannerEl.textContent = total < 2 ? '' : '';
    }
}, 200);

// ---- Scoreboard (hold Tab) ----
function renderScoreboard() {
    const rows = Object.keys(players)
        .map((id) => ({ id, p: players[id] }))
        .sort((a, b) => (b.p.matchWins - a.p.matchWins) || (b.p.kills - a.p.kills) || (b.p.damage - a.p.damage));
    scoreTitleEl.textContent = matchInfo.over ? matchInfo.winnerText : `Match · first to ${matchInfo.targetWins}`;
    scoreBodyEl.innerHTML = '';
    for (const { id, p } of rows) {
        const tr = document.createElement('tr');
        if (id === myId) tr.className = 'me';
        else if (!p.alive) tr.className = 'out';
        const acc = p.shots > 0 ? Math.round((p.hits / p.shots) * 100) + '%' : '—';
        const cells = [
            `<span class="scoreSwatch" style="background:${(p.design && p.design.color) || '#888'}"></span>`,
            (p.design && p.design.name) || '—',
            p.matchWins || 0,
            p.kills || 0,
            p.deaths || 0,
            p.damage || 0,
            acc,
            p.bolts != null ? p.bolts : 0,
        ];
        for (const c of cells) {
            const td = document.createElement('td');
            td.innerHTML = c;
            tr.appendChild(td);
        }
        scoreBodyEl.appendChild(tr);
    }
}

function setScoreboard(show) {
    if (show) renderScoreboard();
    scoreboardEl.classList.toggle('hidden', !show);
}
window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'Tab') { e.preventDefault(); setScoreboard(true); }
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); setScoreboard(false); }
});
window.addEventListener('blur', () => setScoreboard(false));

// ---- Lobby ----
const lobbyEl = document.getElementById('lobby');
const lobbyListEl = document.getElementById('lobbyList');
const lobbyMsgEl = document.getElementById('lobbyMsg');
const lobbyCodeInput = document.getElementById('lobbyCodeInput');

function showLobby(msg) {
    lobbyEl.classList.remove('hidden');
    garageEl.classList.add('hidden');
    document.body.classList.add('in-lobby');
    lobbyMsgEl.textContent = msg || '';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    refreshLobby();
}
function hideLobby() {
    lobbyEl.classList.add('hidden');
    document.body.classList.remove('in-lobby');
}
function enterRoom(code) {
    hideLobby();
    garageEl.classList.remove('hidden');
    try { history.replaceState(null, '', `?room=${code}`); } catch (e) {}
    connectToRoom(code);
}
async function refreshLobby() {
    try {
        const res = await fetch('/api/rooms');
        const data = await res.json();
        renderLobbyRooms(data.rooms || []);
    } catch (e) {
        lobbyMsgEl.textContent = 'Could not load rooms';
    }
}
function renderLobbyRooms(rooms) {
    lobbyListEl.innerHTML = '';
    if (!rooms.length) {
        const p = document.createElement('p');
        p.className = 'lobbyEmpty';
        p.textContent = 'No open rooms — create one!';
        lobbyListEl.appendChild(p);
        return;
    }
    for (const room of rooms) {
        const row = document.createElement('div');
        row.className = 'lobbyRoom';
        const code = document.createElement('span');
        code.className = 'lobbyRoomCode';
        code.textContent = room.code;
        const info = document.createElement('span');
        info.className = 'lobbyRoomInfo';
        info.textContent = `${room.players}/${room.max} · ${room.state}`;
        const btn = document.createElement('button');
        btn.className = 'lobbyBtn';
        const full = room.players >= room.max;
        btn.textContent = full ? 'Full' : 'Join';
        btn.disabled = full;
        btn.onclick = () => enterRoom(room.code);
        row.append(code, info, btn);
        lobbyListEl.appendChild(row);
    }
}
async function createRoom(visibility) {
    try {
        const res = await fetch('/api/rooms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ visibility }),
        });
        const data = await res.json();
        if (data.code) enterRoom(data.code);
    } catch (e) {
        lobbyMsgEl.textContent = 'Could not create room';
    }
}
function joinByCode() {
    const c = lobbyCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    if (c) enterRoom(c);
}

document.getElementById('createOpenBtn').onclick = () => createRoom('open');
document.getElementById('createPrivateBtn').onclick = () => createRoom('private');
document.getElementById('lobbyJoinBtn').onclick = joinByCode;
lobbyCodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinByCode(); });

// Startup: a shared ?room= link skips the lobby; otherwise show it.
if (roomParam) {
    hideLobby();
    garageEl.classList.remove('hidden');
    connectToRoom(roomParam);
} else {
    showLobby();
}
setInterval(() => {
    if (!lobbyEl.classList.contains('hidden')) refreshLobby();
}, 3000);

</script>
