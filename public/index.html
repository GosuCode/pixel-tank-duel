<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Tank Duel</title>
<style>
    :root {
        --bg: #0b0c0a;
        --panel: #13150f;
        --line: #2b2f22;
        --line2: #454b33;
        --text: #d9d6c4;
        --muted: #8c8b76;
        --amber: #e0a938;
        --amber-dim: #8a6a24;
        --olive: #7f8a52;
        --red: #c14b32;
        --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(120% 100% at 50% 0%, #14160f 0%, #0b0c0a 70%);
        color: var(--text);
        font-family: var(--mono);
        letter-spacing: 0.04em;
        overflow: hidden;
        touch-action: none;
        user-select: none;
    }
    #wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #brand {
        position: absolute;
        top: 13px;
        left: 16px;
        z-index: 6;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--olive);
        pointer-events: none;
    }
    #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 12px 16px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(11,12,10,0.92), rgba(11,12,10,0));
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        z-index: 5;
    }
    #hud span { display: flex; align-items: center; gap: 8px; }
    #timer { font-size: 16px; font-weight: 700; color: var(--amber); }
    #status { color: var(--muted); }
    #myBuff { color: var(--amber); }
    #banner {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(22px, 5vw, 40px);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        white-space: pre-line;
        color: var(--text);
        text-shadow: 0 0 18px rgba(0,0,0,0.9), 0 2px 0 #000;
        z-index: 6;
        pointer-events: none;
    }
    canvas {
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 8px;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 24px 60px rgba(0,0,0,0.6), inset 0 0 120px rgba(0,0,0,0.5);
        max-width: 100vw;
        max-height: 100vh;
        touch-action: none;
    }
    .stick {
        position: fixed;
        bottom: 28px;
        width: 124px;
        height: 124px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, rgba(224,169,56,0.06), rgba(0,0,0,0.25));
        border: 1px solid var(--line2);
        z-index: 10;
        display: none;
    }
    .stick .knob {
        position: absolute;
        width: 52px;
        height: 52px;
        left: 36px;
        top: 36px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, rgba(224,169,56,0.55), rgba(224,169,56,0.18));
        border: 1px solid rgba(224,169,56,0.7);
    }
    #moveStick { left: 28px; }
    #fireBtn {
        right: 28px;
        display: none;
        position: fixed;
        bottom: 28px;
        width: 94px;
        height: 94px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, rgba(193,75,50,0.35), rgba(193,75,50,0.1));
        border: 1px solid rgba(193,75,50,0.8);
        color: #f3d9d1;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: 0.18em;
        z-index: 10;
        align-items: center;
        justify-content: center;
        font-size: 13px;
    }
    #help {
        position: absolute;
        bottom: 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.7;
        z-index: 5;
    }
    @media (max-width: 560px) {
        #brand { display: none; }
    }
    #customizeBtn {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 20;
        background: transparent;
        border: 1px solid var(--line2);
        color: var(--text);
        border-radius: 6px;
        padding: 7px 12px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    #customizeBtn:hover { border-color: var(--amber); color: var(--amber); background: rgba(224,169,56,0.06); }
    #garage {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: radial-gradient(120% 120% at 50% 0%, rgba(20,22,15,0.96), rgba(5,6,4,0.98));
    }
    #garage.hidden { display: none; }
    #garageCard {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 22px 24px 20px;
        width: min(600px, 100%);
        max-height: 100%;
        overflow-y: auto;
        box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    #garageCard::before, #garageCard::after {
        content: '';
        position: absolute;
        width: 14px;
        height: 14px;
        border: 1px solid var(--amber);
        opacity: 0.75;
    }
    #garageCard::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    #garageCard::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    #garageCard h1 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
        color: var(--text);
    }
    #garageCard .sub {
        margin: 0 0 18px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
    }
    #garageBody {
        display: flex;
        gap: 22px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
    }
    #preview {
        background:
            linear-gradient(rgba(127,138,82,0.06) 1px, transparent 1px) 0 0 / 100% 20px,
            linear-gradient(90deg, rgba(127,138,82,0.06) 1px, transparent 1px) 0 0 / 20px 100%,
            #0f1109;
        border: 1px solid var(--line2);
        border-radius: 8px;
        flex: 0 0 auto;
    }
    #garageControls { flex: 1 1 260px; min-width: 0; }
    .garageRow { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .garageLabel { width: 54px; flex: 0 0 auto; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .garageOpts { display: flex; flex-wrap: wrap; gap: 6px; }
    .garageName {
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 5px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 7px 10px;
        width: 120px;
        outline: none;
    }
    .garageName:focus { border-color: var(--amber); }
    .garageName::placeholder { color: var(--muted); opacity: 0.6; }
    .garageOpt {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line2);
        border-radius: 5px;
        padding: 7px 11px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.12s;
    }
    .garageOpt:hover { border-color: var(--amber-dim); }
    .garageOpt.selected { background: var(--amber); border-color: var(--amber); color: #141509; font-weight: 700; }
    .garageSwatch {
        width: 28px;
        height: 28px;
        border-radius: 5px;
        border: 1px solid rgba(0,0,0,0.5);
        box-shadow: 0 0 0 1px var(--line2);
        cursor: pointer;
        padding: 0;
        transition: box-shadow 0.12s, transform 0.12s;
    }
    .garageSwatch:hover { transform: translateY(-1px); }
    .garageSwatch.selected { box-shadow: 0 0 0 2px var(--amber); }
    #garageDone {
        display: block;
        margin: 20px auto 0;
        background: var(--amber);
        color: #141509;
        border: none;
        border-radius: 6px;
        padding: 11px 40px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        cursor: pointer;
    }
    #garageDone:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<div id="wrap">
    <div id="brand">Pixel Tank Duel</div>
    <div id="hud">
        <span id="timer">--</span>
        <span id="status"></span>
        <span id="myBuff"></span>
    </div>
    <div id="banner"></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="help">Move: WASD / Arrows &nbsp;•&nbsp; Fire: Space</div>
</div>
<div id="moveStick" class="stick"><div class="knob"></div></div>
<div id="fireBtn">Fire</div>
<button id="customizeBtn">Armory (G)</button>
<div id="garage">
    <div id="garageCard">
        <h1>Armory</h1>
        <p class="sub">Tank Configuration</p>
        <div id="garageBody">
            <canvas id="preview" width="180" height="180"></canvas>
            <div id="garageControls"></div>
        </div>
        <button id="garageDone">Deploy</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const myBuffEl = document.getElementById('myBuff');
const bannerEl = document.getElementById('banner');

const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${location.host}`);

let myId = null;
let players = {};
let bullets = [];
let obstacles = [];
let powerup = null;
let mapName = '';
let arena = { w: 800, h: 600 };
let roundInfo = { state: 'waiting', timeLeft: 0, winnerText: '' };

const POWERUP_META = {
    speed: { color: '#00e5ff', label: 'S', name: 'SPEED' },
    rapid: { color: '#ff9100', label: 'F', name: 'RAPID FIRE' },
    triple: { color: '#b388ff', label: 'T', name: 'TRIPLE SHOT' },
    ricochet: { color: '#ffd600', label: 'R', name: 'RICOCHET' },
    shield: { color: '#2979ff', label: 'B', name: 'SHIELD' },
};

// ---- Tank design (cosmetic) ----
const DEFAULT_DESIGN = { name: '', hull: 'classic', turret: 'square', barrel: 'medium', treads: 'treads', color: '#FF4136' };
const sanitizeName = (v) => String(v || '').replace(/[^\w -]/g, '').slice(0, 4);
const BARREL_LEN = { short: 10, medium: 18, long: 26 };
const PART_LABELS = { hull: 'Hull', turret: 'Turret', barrel: 'Barrel' };

let palette = [];
let parts = {};
let design = { ...DEFAULT_DESIGN };
try {
    const saved = JSON.parse(localStorage.getItem('tankDesign') || 'null');
    if (saved && typeof saved === 'object') Object.assign(design, saved);
} catch {}
design.treads = 'treads';
design.name = sanitizeName(design.name);

const garageEl = document.getElementById('garage');
const previewCtx = document.getElementById('preview').getContext('2d');
const garageControls = document.getElementById('garageControls');

function shade(hex, factor) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * factor);
    const g = Math.round(((n >> 8) & 255) * factor);
    const b = Math.round((n & 255) * factor);
    return `rgb(${r},${g},${b})`;
}

function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
}

function hullPath(g, shape) {
    if (shape === 'wedge') {
        g.beginPath();
        g.moveTo(-14, -11);
        g.lineTo(8, -11);
        g.lineTo(14, 0);
        g.lineTo(8, 11);
        g.lineTo(-14, 11);
        g.closePath();
    } else if (shape === 'round') {
        roundRect(g, -14, -11, 28, 22, 8);
    } else {
        roundRect(g, -14, -11, 28, 22, 4);
    }
}

function drawTank(g, d, highlight) {
    const body = d.color;
    const dark = shade(body, 0.6);
    const mid = shade(body, 0.82);

    if (d.treads === 'treads') {
        for (const ty of [-15, 9]) {
            roundRect(g, -15, ty, 30, 6, 2.5);
            g.fillStyle = '#454d5c';
            g.fill();
            g.fillStyle = '#20242c';
            for (const tx of [-11, -6, -1, 4, 9]) g.fillRect(tx, ty + 1.5, 2, 3);
        }
    } else if (d.treads === 'wheels') {
        g.fillStyle = '#454d5c';
        for (const wx of [-10, 0, 10]) {
            g.beginPath(); g.arc(wx, -12.5, 3.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.arc(wx, 12.5, 3.5, 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = '#20242c';
        for (const wx of [-10, 0, 10]) {
            g.beginPath(); g.arc(wx, -12.5, 1.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.arc(wx, 12.5, 1.5, 0, Math.PI * 2); g.fill();
        }
    }

    g.save();
    hullPath(g, d.hull);
    if (d.hull === 'wedge') {
        g.strokeStyle = body;
        g.lineJoin = 'round';
        g.lineWidth = 4;
        g.stroke();
    }
    g.fillStyle = body;
    g.fill();
    hullPath(g, d.hull);
    g.clip();
    g.fillStyle = mid;
    g.fillRect(-15, -14, 30, 7);
    g.restore();

    g.fillStyle = dark;
    if (d.turret === 'round') {
        g.beginPath(); g.arc(1, 0, 8, 0, Math.PI * 2); g.fill();
    } else if (d.turret === 'dome') {
        g.beginPath(); g.arc(1, 0, 9, 0, Math.PI * 2); g.fill();
        g.fillStyle = mid;
        g.beginPath(); g.arc(1, 0, 5, 0, Math.PI * 2); g.fill();
    } else {
        roundRect(g, -5, -8, 14, 16, 3);
        g.fill();
    }

    const bl = BARREL_LEN[d.barrel] || BARREL_LEN.medium;
    g.fillStyle = dark;
    roundRect(g, 5, -3, bl, 6, 3);
    g.fill();
    g.fillStyle = mid;
    roundRect(g, 5, -3, bl, 2, 1);
    g.fill();
    g.fillStyle = '#111';
    roundRect(g, 5 + bl - 3, -4, 3, 8, 1.5);
    g.fill();

    if (highlight) {
        g.strokeStyle = '#fff';
        g.lineWidth = 2;
        g.lineJoin = 'round';
        hullPath(g, d.hull);
        g.stroke();
    }
}

function drawPreview() {
    const w = previewCtx.canvas.width;
    const h = previewCtx.canvas.height;
    previewCtx.clearRect(0, 0, w, h);
    previewCtx.save();
    previewCtx.translate(w / 2, h / 2);
    previewCtx.scale(2.6, 2.6);
    drawTank(previewCtx, design, false);
    previewCtx.restore();
}

function buildGarage() {
    garageControls.innerHTML = '';

    const nameRow = document.createElement('div');
    nameRow.className = 'garageRow';
    const nameLabel = document.createElement('span');
    nameLabel.className = 'garageLabel';
    nameLabel.textContent = 'Name';
    nameRow.appendChild(nameLabel);
    const nameInput = document.createElement('input');
    nameInput.className = 'garageName';
    nameInput.maxLength = 4;
    nameInput.value = design.name || '';
    nameInput.placeholder = '4 CHARS';
    nameInput.autocomplete = 'off';
    nameInput.spellcheck = false;
    nameInput.oninput = () => {
        design.name = sanitizeName(nameInput.value);
        if (nameInput.value !== design.name) nameInput.value = design.name;
        sendDesign();
    };
    nameRow.appendChild(nameInput);
    garageControls.appendChild(nameRow);

    for (const key of Object.keys(PART_LABELS)) {
        const row = document.createElement('div');
        row.className = 'garageRow';
        const label = document.createElement('span');
        label.className = 'garageLabel';
        label.textContent = PART_LABELS[key];
        row.appendChild(label);
        const opts = document.createElement('div');
        opts.className = 'garageOpts';
        for (const opt of parts[key] || []) {
            const btn = document.createElement('button');
            btn.className = 'garageOpt' + (design[key] === opt ? ' selected' : '');
            btn.textContent = opt;
            btn.onclick = () => { design[key] = opt; buildGarage(); sendDesign(); };
            opts.appendChild(btn);
        }
        row.appendChild(opts);
        garageControls.appendChild(row);
    }

    const row = document.createElement('div');
    row.className = 'garageRow';
    const label = document.createElement('span');
    label.className = 'garageLabel';
    label.textContent = 'Color';
    row.appendChild(label);
    const opts = document.createElement('div');
    opts.className = 'garageOpts';
    for (const c of palette) {
        const btn = document.createElement('button');
        btn.className = 'garageSwatch' + (design.color === c.hex ? ' selected' : '');
        btn.style.background = c.hex;
        btn.title = c.name;
        btn.onclick = () => { design.color = c.hex; buildGarage(); sendDesign(); };
        opts.appendChild(btn);
    }
    row.appendChild(opts);
    garageControls.appendChild(row);
    drawPreview();
}

function applyCatalog(data) {
    palette = Array.isArray(data.palette) ? data.palette : [];
    parts = data.parts && typeof data.parts === 'object' ? data.parts : {};
    for (const key of Object.keys(PART_LABELS)) {
        if (!Array.isArray(parts[key]) || !parts[key].includes(design[key])) design[key] = DEFAULT_DESIGN[key];
    }
    if (!palette.some((c) => c.hex === design.color)) design.color = DEFAULT_DESIGN.color;
    buildGarage();
}

function sendDesign() {
    localStorage.setItem('tankDesign', JSON.stringify(design));
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'design', design }));
}

document.getElementById('garageDone').onclick = () => garageEl.classList.add('hidden');
document.getElementById('customizeBtn').onclick = () => { garageEl.classList.remove('hidden'); drawPreview(); };
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'g') { garageEl.classList.remove('hidden'); drawPreview(); } });

// ---- Input state ----
const keys = {};
let inputDx = 0, inputDy = 0, inputFire = false;

window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function computeKeyboardVector() {
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    return { dx, dy };
}
let keyboardFire = false;
window.addEventListener('keydown', (e) => { if (e.key === ' ') keyboardFire = true; });
window.addEventListener('keyup', (e) => { if (e.key === ' ') keyboardFire = false; });

// ---- Touch controls (shown only on touch devices) ----
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const moveStick = document.getElementById('moveStick');
const knob = moveStick.querySelector('.knob');
const fireBtn = document.getElementById('fireBtn');
let stickDx = 0, stickDy = 0, stickActive = false, stickTouchId = null;
let touchFire = false;

if (isTouch) {
    moveStick.style.display = 'block';
    fireBtn.style.display = 'flex';
    document.getElementById('help').style.display = 'none';

    moveStick.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        stickTouchId = t.identifier;
        stickActive = true;
        updateStick(t);
    });
    moveStick.addEventListener('touchmove', (e) => {
        for (const t of e.changedTouches) {
            if (t.identifier === stickTouchId) updateStick(t);
        }
    });
    moveStick.addEventListener('touchend', resetStick);
    moveStick.addEventListener('touchcancel', resetStick);

    function updateStick(t) {
        const rect = moveStick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = (t.clientX - cx) / (rect.width / 2);
        let dy = (t.clientY - cy) / (rect.height / 2);
        const len = Math.hypot(dx, dy);
        if (len > 1) { dx /= len; dy /= len; }
        stickDx = dx; stickDy = dy;
        knob.style.left = `${36 + dx * 36}px`;
        knob.style.top = `${36 + dy * 36}px`;
    }
    function resetStick() {
        stickActive = false;
        stickTouchId = null;
        stickDx = 0; stickDy = 0;
        knob.style.left = '36px';
        knob.style.top = '36px';
    }

    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); touchFire = true; });
    fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); touchFire = false; });
    fireBtn.addEventListener('touchcancel', () => { touchFire = false; });
}

// ---- Networking ----
ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'init') {
        myId = data.id;
        arena = data.arena;
        obstacles = data.obstacles;
        mapName = data.mapName || '';
        canvas.width = arena.w;
        canvas.height = arena.h;
        applyCatalog(data);
        sendDesign();
    } else if (data.type === 'full') {
        bannerEl.textContent = 'Game is full (4/4 players)';
    } else if (data.type === 'map') {
        obstacles = data.obstacles;
        mapName = data.name || mapName;
    } else if (data.type === 'state') {
        players = data.players;
        bullets = data.bullets;
        powerup = data.powerup;
        roundInfo = data.round;
    }
};

setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) return;
    if (!garageEl.classList.contains('hidden')) {
        ws.send(JSON.stringify({ type: 'input', dx: 0, dy: 0, fire: false }));
        return;
    }
    const kb = computeKeyboardVector();
    const dx = kb.dx !== 0 ? kb.dx : stickDx;
    const dy = kb.dy !== 0 ? kb.dy : stickDy;
    const fire = keyboardFire || touchFire;
    ws.send(JSON.stringify({ type: 'input', dx, dy, fire }));
}, 1000 / 30);

// ---- Rendering ----
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(127,138,82,0.07)';
    ctx.lineWidth = 1;
    const grid = 40;
    ctx.beginPath();
    for (let x = grid; x < canvas.width; x += grid) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, canvas.height);
    }
    for (let y = grid; y < canvas.height; y += grid) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(canvas.width, y + 0.5);
    }
    ctx.stroke();

    for (const o of obstacles) {
        roundRect(ctx, o.x, o.y, o.w, o.h, Math.min(4, o.w / 2, o.h / 2));
        ctx.fillStyle = '#242819';
        ctx.fill();
        ctx.strokeStyle = '#3b4129';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    if (powerup) {
        const meta = POWERUP_META[powerup.type];
        const pulse = 3 * Math.sin(Date.now() / 150);
        ctx.beginPath();
        ctx.arc(powerup.x, powerup.y, 14 + pulse, 0, Math.PI * 2);
        ctx.fillStyle = meta.color;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#111';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(meta.label, powerup.x, powerup.y + 1);
        ctx.textBaseline = 'alphabetic';
    }

    for (const b of bullets) {
        ctx.fillStyle = b.hot ? '#ffd600' : '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.hot ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
    }

    for (const id in players) {
        const p = players[id];
        if (!p.alive) continue;

        if (p.buff && p.buff.type === 'shield') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
            ctx.strokeStyle = '#2979ff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.7;
            ctx.stroke();
            ctx.fillStyle = '#2979ff';
            ctx.globalAlpha = 0.12;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        drawTank(ctx, p.design || DEFAULT_DESIGN, id === myId);
        ctx.restore();

        const label = (p.design && p.design.name) || '';
        ctx.textAlign = 'center';
        if (label) {
            ctx.fillStyle = p.design.color;
            ctx.font = 'bold 11px ui-monospace, monospace';
            ctx.fillText(label, p.x, p.y - 24);
        }
        const starY = label ? p.y - 36 : p.y - 24;
        ctx.fillStyle = '#e0a938';
        ctx.font = '11px ui-monospace, monospace';
        ctx.fillText(`★${p.kills}`, p.x, starY);

        if (p.buff) {
            const meta = POWERUP_META[p.buff.type];
            ctx.beginPath();
            ctx.arc(p.x, starY - 12, 8, 0, Math.PI * 2);
            ctx.fillStyle = meta.color;
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.font = 'bold 9px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(meta.label, p.x, starY - 11);
            ctx.textBaseline = 'alphabetic';
        }
    }

    requestAnimationFrame(draw);
}
draw();

// ---- HUD ----
setInterval(() => {
    const alive = Object.values(players).filter((p) => p.alive).length;
    const total = Object.keys(players).length;

    const mine = myId ? players[myId] : null;
    if (mine && mine.buff) {
        const meta = POWERUP_META[mine.buff.type];
        myBuffEl.textContent = `${meta.name} ${Math.ceil(mine.buff.timeLeft / 1000)}s`;
        myBuffEl.style.color = meta.color;
    } else {
        myBuffEl.textContent = '';
    }

    if (roundInfo.state === 'active') {
        timerEl.textContent = Math.ceil(roundInfo.timeLeft / 1000) + 's';
        statusEl.textContent = mapName ? `${mapName} · ${alive}/${total} alive` : `${alive}/${total} alive`;
        bannerEl.textContent = '';
    } else if (roundInfo.state === 'ended') {
        timerEl.textContent = '';
        statusEl.textContent = '';
        bannerEl.textContent = roundInfo.winnerText + '\nNext round soon...';
    } else {
        timerEl.textContent = '';
        statusEl.textContent = total < 2 ? 'Waiting for another player...' : '';
        bannerEl.textContent = total < 2 ? '' : '';
    }
}, 200);
</script>
</body>
