<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Tank Duel</title>
<style>
    :root {
        --bg: #0b0c0a;
        --panel: #13150f;
        --line: #2b2f22;
        --line2: #454b33;
        --text: #d9d6c4;
        --muted: #8c8b76;
        --amber: #e0a938;
        --amber-dim: #8a6a24;
        --olive: #7f8a52;
        --red: #c14b32;
        --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(120% 100% at 50% 0%, #14160f 0%, #0b0c0a 70%);
        color: var(--text);
        font-family: var(--mono);
        letter-spacing: 0.04em;
        overflow: hidden;
        touch-action: none;
        user-select: none;
    }
    #wrap {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 54px 10px 38px;
    }
    #brand {
        position: absolute;
        top: 13px;
        left: 16px;
        z-index: 6;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--olive);
        pointer-events: none;
    }
    #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px 28px;
        padding: 12px 16px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(11,12,10,0.92), rgba(11,12,10,0));
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        z-index: 5;
    }
    #hud span { display: flex; align-items: center; gap: 8px; }
    #timer { font-size: 16px; font-weight: 700; color: var(--amber); }
    #status { color: var(--muted); }
    #myBuff { color: var(--amber); }
    #playerCount { color: var(--text); }
    #banner {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(22px, 5vw, 40px);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        white-space: pre-line;
        color: var(--text);
        text-shadow: 0 0 18px rgba(0,0,0,0.9), 0 2px 0 #000;
        z-index: 6;
        pointer-events: none;
    }
    canvas {
        display: block;
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 8px;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 24px 60px rgba(0,0,0,0.6), inset 0 0 120px rgba(0,0,0,0.5);
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
    }
    .stick {
        position: fixed;
        bottom: 28px;
        width: 124px;
        height: 124px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, rgba(224,169,56,0.06), rgba(0,0,0,0.25));
        border: 1px solid var(--line2);
        z-index: 10;
        display: none;
    }
    .stick .knob {
        position: absolute;
        width: 52px;
        height: 52px;
        left: 36px;
        top: 36px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, rgba(224,169,56,0.55), rgba(224,169,56,0.18));
        border: 1px solid rgba(224,169,56,0.7);
    }
    #moveStick { left: 28px; }
    #aimStick { right: 28px; }
    #fireBtn {
        right: 28px;
        display: none;
        position: fixed;
        bottom: 28px;
        width: 94px;
        height: 94px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, rgba(193,75,50,0.35), rgba(193,75,50,0.1));
        border: 1px solid rgba(193,75,50,0.8);
        color: #f3d9d1;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: 0.18em;
        z-index: 10;
        align-items: center;
        justify-content: center;
        font-size: 13px;
    }
    #help {
        position: absolute;
        bottom: 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.7;
        z-index: 5;
    }
    @media (max-width: 560px) {
        #brand { display: none; }
    }
    #customizeBtn {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 20;
        background: transparent;
        border: 1px solid var(--line2);
        color: var(--text);
        border-radius: 6px;
        padding: 7px 12px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    #customizeBtn:hover { border-color: var(--amber); color: var(--amber); background: rgba(224,169,56,0.06); }
    #garage {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: radial-gradient(120% 120% at 50% 0%, rgba(20,22,15,0.96), rgba(5,6,4,0.98));
    }
    #garage.hidden { display: none; }
    #garageCard {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 22px 24px 20px;
        width: min(1180px, 100%);
        max-height: 100%;
        overflow-y: auto;
        scrollbar-width: none;
        box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    #garageCard::-webkit-scrollbar { display: none; }
    #garageCard::before, #garageCard::after {
        content: '';
        position: absolute;
        width: 14px;
        height: 14px;
        border: 1px solid var(--amber);
        opacity: 0.75;
    }
    #garageCard::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    #garageCard::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    #garageCard h1 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
        color: var(--text);
    }
    #garageCard .sub {
        margin: 0 0 18px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
    }
    #garageBody {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        flex-wrap: wrap;
        justify-content: center;
    }
    #garagePreviewCol { display: flex; justify-content: center; }
    #preview {
        background:
            linear-gradient(rgba(127,138,82,0.06) 1px, transparent 1px) 0 0 / 100% 20px,
            linear-gradient(90deg, rgba(127,138,82,0.06) 1px, transparent 1px) 0 0 / 20px 100%,
            #0f1109;
        border: 1px solid var(--line2);
        border-radius: 8px;
        flex: 0 0 auto;
    }
    #garageLeftCol { display: flex; flex-direction: column; gap: 16px; flex: 0 0 300px; }
    #garageControls { flex: 0 0 auto; min-width: 0; }
    #garageForgeCol { flex: 1 1 420px; min-width: 0; }
    .garageRow { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .garageLabel { width: 54px; flex: 0 0 auto; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .garageOpts { display: flex; flex-wrap: wrap; gap: 6px; }
    .garageName {
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 5px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 7px 10px;
        width: 120px;
        outline: none;
    }
    .garageName:focus { border-color: var(--amber); }
    .garageName::placeholder { color: var(--muted); opacity: 0.6; }
    .garageOpt {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line2);
        border-radius: 5px;
        padding: 7px 11px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.12s;
    }
    .garageOpt:hover { border-color: var(--amber-dim); }
    .garageOpt.selected { background: var(--amber); border-color: var(--amber); color: #141509; font-weight: 700; }
    .garageSwatch {
        width: 28px;
        height: 28px;
        border-radius: 5px;
        border: 1px solid rgba(0,0,0,0.5);
        box-shadow: 0 0 0 1px var(--line2);
        cursor: pointer;
        padding: 0;
        transition: box-shadow 0.12s, transform 0.12s;
    }
    .garageSwatch:hover { transform: translateY(-1px); }
    .garageSwatch.selected { box-shadow: 0 0 0 2px var(--amber); }
    #garageDone {
        display: block;
        margin: 20px auto 0;
        background: var(--amber);
        color: #141509;
        border: none;
        border-radius: 6px;
        padding: 11px 40px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        cursor: pointer;
    }
    #garageDone:hover { filter: brightness(1.08); }
    #garageError {
        margin: 14px 0 0;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--red);
    }
    #garageError.hidden { display: none; }
    #scoreboard {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5,6,4,0.72);
        backdrop-filter: blur(2px);
    }
    #scoreboard.hidden { display: none; }
    #scoreCard {
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 18px 22px 14px;
        min-width: min(440px, 92vw);
        max-width: 96vw;
        overflow-x: auto;
        scrollbar-width: none;
        box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    #scoreCard::-webkit-scrollbar { display: none; }
    #scoreCard h2 {
        margin: 0 0 12px;
        font-size: 13px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
        color: var(--amber);
    }
    #scoreCard table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #scoreCard th {
        text-align: right;
        padding: 5px 8px;
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
    }
    #scoreCard th:nth-child(2) { text-align: left; }
    #scoreCard td {
        text-align: right;
        padding: 6px 8px;
        font-variant-numeric: tabular-nums;
        border-bottom: 1px solid rgba(43,47,34,0.5);
    }
    #scoreCard td:nth-child(2) { text-align: left; font-weight: 700; }
    #scoreCard tr.me td { color: var(--amber); }
    #scoreCard tr.out td { opacity: 0.5; }
    .scoreSwatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        border: 1px solid rgba(0,0,0,0.5);
    }
    .scoreHint {
        margin: 12px 0 0;
        text-align: center;
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
    }
    #hurtVignette {
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 42%, rgba(193,75,50,0.6) 100%);
    }
    #emoteBar {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        z-index: 12;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        padding: 6px;
        max-width: calc(100vw - 20px);
        border-radius: 10px;
        background: rgba(11,12,10,0.72);
        border: 1px solid var(--line);
        backdrop-filter: blur(3px);
    }
    #emoteBar.hidden { display: none; }
    .emoteBtn {
        min-width: 46px;
        height: 38px;
        padding: 0 8px;
        border-radius: 7px;
        background: transparent;
        border: 1px solid var(--line2);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: border-color 0.12s, color 0.12s, transform 0.08s, background 0.12s;
    }
    .emoteBtn:hover { border-color: var(--amber); color: var(--amber); background: rgba(224,169,56,0.08); }
    .emoteBtn:active { transform: scale(0.9); }
    .emoteBtn .k { display: block; font-size: 8px; font-weight: 400; color: var(--muted); letter-spacing: 0.1em; }
    #chatBar {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        z-index: 13;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(11,12,10,0.94);
        border: 1px solid var(--amber-dim);
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    #chatBar.hidden { display: none; }
    #chatInput {
        width: min(46vw, 320px);
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 6px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.08em;
        padding: 8px 10px;
        outline: none;
    }
    #chatInput:focus { border-color: var(--amber); }
    #chatInput::placeholder { color: var(--muted); opacity: 0.6; }
    #chatSend {
        background: var(--amber);
        color: #141509;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
    }
    @media (max-width: 560px) {
        #emoteBar { bottom: 168px; gap: 4px; }
        .emoteBtn { min-width: 42px; height: 34px; font-size: 11px; }
        #chatBar { bottom: 168px; }
    }
    /* ---- Bolt economy + haunts ---- */
    #myBolts { color: var(--amber); font-weight: 700; }
    #myBolts .haunted { color: var(--red); }
    #boltFeed {
        position: fixed;
        top: 58px;
        right: 16px;
        z-index: 45;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        pointer-events: none;
    }
    .boltNote {
        background: rgba(11,12,10,0.9);
        border: 1px solid var(--amber-dim);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--amber);
        animation: boltIn 0.18s ease-out, boltOut 0.3s ease-in 2.7s forwards;
        white-space: nowrap;
        max-width: 260px;
        text-align: right;
    }
    .boltNote.neg { color: var(--red); border-color: var(--red); }
    .boltNote.atk { color: #ff1744; border-color: #ff1744; }
    @keyframes boltIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes boltOut { from { opacity: 1; } to { opacity: 0; } }
    .hauntInvert { filter: invert(1) hue-rotate(180deg); transition: filter 0.12s; }
    .blurStart { filter: blur(2px); transition: filter 0.2s; }
    .garageSection {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0 10px;
    }
    .garageSection::before, .garageSection::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
    }
    .garageSection span {
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--amber);
    }
    #myBoltsTotal { font-size: 13px; letter-spacing: 0.1em; }
    #forgeIntro {
        margin: 0 0 8px;
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
    }
    .forgeCat { margin: 0 0 4px; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .forgeRow { display: flex; gap: 10px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; align-items: flex-start; padding-bottom: 4px; }
    .forgeRow::-webkit-scrollbar { display: none; }
    .forgeGrid { display: flex; flex-direction: column; gap: 4px; min-width: 92px; flex-shrink: 0; }
    .forgeItem {
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 7px;
        padding: 6px 7px;
        position: relative;
        cursor: pointer;
        transition: border-color 0.12s, background 0.12s;
    }
    .forgeItem:hover { border-color: var(--amber-dim); }
    .forgeItem.equipped { border-color: var(--amber); background: rgba(224,169,56,0.08); }
    .forgeItem .swatch { width: 100%; height: 6px; border-radius: 3px; margin-bottom: 4px; opacity: 0.9; }
    .forgeItem .fi { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); }
    .forgeItem .fc { font-size: 9px; letter-spacing: 0.08em; color: var(--amber); font-variant-numeric: tabular-nums; }
    .forgeItem .fd { display: none; }
    .forgeItem .fk { position: absolute; top: 5px; right: 7px; font-size: 8px; color: var(--olive); letter-spacing: 0.1em; }
    .forgeItem.owned .fk { color: var(--amber); }
    .forgeItem.locked { opacity: 0.5; }
    .forgeItem.disabled { opacity: 0.4; cursor: default; }
    #streakRow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .streakBadge {
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 1px solid var(--line2);
        border-radius: 5px;
        padding: 4px 8px;
        color: var(--muted);
    }
    .streakBadge.earned { color: #ffd600; border-color: #ffd600; }
    #hauntTag {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--red);
        background: rgba(11,12,10,0.7);
        border: 1px solid var(--red);
        border-radius: 20px;
        padding: 4px 14px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
    }
    #hauntTag.on { opacity: 1; }

    /* ---- Lobby (full page) ---- */
    #lobby {
        position: fixed;
        inset: 0;
        z-index: 20;
        overflow-y: auto;
        scrollbar-width: none;
        background: radial-gradient(120% 120% at 50% 0%, #14160f 0%, #0b0c0a 70%);
    }
    #lobby::-webkit-scrollbar { display: none; }
    #lobby.hidden { display: none; }
    #lobbyPage {
        min-height: 100%;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px clamp(16px, 4vw, 48px) 44px;
        display: flex;
        flex-direction: column;
        gap: 22px;
    }
    #lobbyHead h1 {
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--text);
    }
    #lobbyHead .sub {
        margin: 0;
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
    }
    #lobbyBody { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
    #lobbyCreate { flex: 0 0 300px; display: flex; flex-direction: column; gap: 8px; }
    #lobbyCreate .garageSection:first-child { margin-top: 0; }
    #lobbyRooms { flex: 1 1 420px; min-width: 0; }
    #lobbyRooms .garageSection { margin-top: 0; }
    .lobbyBtn {
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 6px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 10px 12px;
        cursor: pointer;
        transition: border-color 0.12s, background 0.12s;
    }
    .lobbyBtn:hover:not(:disabled) { border-color: var(--amber); background: rgba(224,169,56,0.08); }
    .lobbyBtn:disabled { opacity: 0.4; cursor: default; }
    #lobbyList { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
    .lobbyEmpty { font-size: 10px; letter-spacing: 0.12em; color: var(--muted); margin: 6px 0; }
    .lobbyRoom {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 6px;
        padding: 10px 12px;
    }
    .lobbyRoomCode { font-size: 13px; letter-spacing: 0.28em; color: var(--amber); }
    .lobbyRoomInfo { flex: 1; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .lobbyRoom .lobbyBtn { flex: 0 0 auto; }
    #lobbyJoinRow { display: flex; gap: 8px; }
    #lobbyJoinRow input {
        flex: 1;
        min-width: 0;
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 6px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        padding: 9px 10px;
    }
    #lobbyMsg { margin: 0; min-height: 12px; font-size: 10px; letter-spacing: 0.14em; color: var(--red); }
    body.in-lobby #hud, body.in-lobby #help, body.in-lobby #customizeBtn, body.in-lobby #emoteBar { display: none; }

    /* ---- Responsive ---- */
    /* Panels stack before they get cramped; the game canvas keeps its 4:3 ratio. */
    @media (max-width: 900px) {
        #brand { display: none; }
    }
    @media (max-width: 820px) {
        #lobbyCreate, #lobbyRooms, #garageLeftCol, #garageForgeCol { flex: 1 1 100%; }
        #garageCard { padding: 18px 16px 16px; }
    }
    @media (max-width: 720px) {
        #wrap { padding: 50px 8px 30px; }

        #timer { font-size: 14px; }

    }
    @media (max-width: 560px) {

        #wrap { padding: 54px 6px 22px; }
        /* reserve the top-right corner for the Armory button */
        #hud { gap: 4px 12px; font-size: 10px; letter-spacing: 0.1em; padding: 8px 104px 8px 10px; }
        #timer { font-size: 13px; }
        #customizeBtn { font-size: 10px; padding: 6px 9px; top: 9px; right: 9px; }
        .boltNote { max-width: 190px; font-size: 10px; }

        #preview { width: 140px; height: 140px; }

    @media (max-width: 400px) {

        #preview { width: 120px; height: 120px; }
        #lobbyPage { padding: 22px 14px 30px; }

    /* Short screens (landscape phones): shrink the touch controls, drop the help line. */
    @media (max-height: 520px) {
        #wrap { padding: 44px 8px 10px; }
        #help { display: none; }
        .stick { width: 96px; height: 96px; bottom: 14px; }
        .stick .knob { width: 40px; height: 40px; }
        #moveStick { left: 16px; }

    @media (max-width: 560px) and (max-height: 760px) {

        .stick .knob { width: 44px; height: 44px; }

        #emoteBar { display: none; }

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const seriesEl = document.getElementById('series');
const myBuffEl = document.getElementById('myBuff');
const bannerEl = document.getElementById('banner');
const scoreboardEl = document.getElementById('scoreboard');
const scoreTitleEl = document.getElementById('scoreTitle');
const scoreBodyEl = document.getElementById('scoreBody');
const hurtVignetteEl = document.getElementById('hurtVignette');
const boltFeedEl = document.getElementById('boltFeed');
const boltsEl = document.getElementById('myBolts');
const playerCountEl = document.getElementById('playerCount');
const hauntTagEl = document.getElementById('hauntTag');

const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';

// Device identity: a random secret kept in localStorage. The server keys your
// bolt bank to it, so progress persists with no login. Clearing site data or
// switching devices starts a fresh identity.
let deviceToken = localStorage.getItem('tankToken');
if (!deviceToken) {
    if (window.crypto && crypto.randomUUID) {
        deviceToken = crypto.randomUUID();
    } else if (window.crypto && crypto.getRandomValues) {
        const buf = new Uint8Array(16);
        crypto.getRandomValues(buf);
        deviceToken = Array.from(buf, (x) => x.toString(16).padStart(2, '0')).join('');
    } else {
        deviceToken = Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    }
    localStorage.setItem('tankToken', deviceToken);
}

// Room: join the code in ?room=CODE, otherwise pick one from the lobby.
const roomParam = (new URLSearchParams(location.search).get('room') || '')
    .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
let roomCode = roomParam;

let ws = null;
function sendWs(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}
function connectToRoom(code) {
    roomCode = code || '';
    const url = `${protocol}//${location.host}/` + (roomCode ? `?room=${roomCode}` : '');
    ws = new WebSocket(url);
    ws.addEventListener('open', () => sendWs({ type: 'auth', token: deviceToken }));
    ws.onmessage = handleMessage;
}

let myId = null;
let players = {};
let bullets = [];
let obstacles = [];
let holes = [];
let explosions = [];
let powerup = null;
let mapName = '';
let arena = { w: 800, h: 600 };
const MAX_PLAYERS = 4;
let roundInfo = { state: 'waiting', timeLeft: 0, winnerText: '' };
let matchInfo = { targetWins: 3, roundNumber: 0, over: false, winnerText: '' };
let powerupNext = null;
let roundActiveStart = 0; // performance.now() when the current round went active
let prevRoundState = 'waiting';

// ---- Trash talk ----
const EMOTES = [
    { key: '1', text: 'GG' },
    { key: '2', text: 'REKT' },
    { key: '3', text: 'NICE!' },
    { key: '4', text: 'LOL' },
    { key: '5', text: 'EZ' },
    { key: '6', text: 'OOPS' },
    { key: '7', text: 'HeHeHe...' },
];
const seenTaunts = {}; // playerId -> taunt.at already reacted to
const tauntAnims = {}; // playerId -> { start }
const seenBooms = new Set(); // explosion ids already reacted to
const boomAnims = {}; // explosion id -> { start, x, y, color, seed }
const lastHp = {}; // playerId -> last seen hp (to trigger the hit flash)
const hitFlash = {}; // playerId -> performance.now() of last damage
const seenHits = new Set(); // hit-event ids already reacted to
const seenFires = new Set(); // muzzle-event ids already reacted to
const muzzleFlashes = []; // { x, y, angle, start, by } transient muzzle flashes
const barrelKick = {}; // playerId -> performance.now() of last shot (barrel recoil anim)
const damageNumbers = []; // { x, y, text, color, start }
let hitMark = { start: 0, kill: false }; // shooter hitmarker
let hurtFlashAt = 0; // performance.now() when we last took damage
let shakeUntil = 0; // screen shake window
let shakeMag = 0;
let shakeDur = 180; // ms the active shake lasts (used to decay from full strength)
let chatOpen = false;
let shopItems = [];
let mapsList = [];
let streakSkinDefs = [];
let bankInfo = { bolts: 0, owned: [], bought: {}, streak: 0, wins: 0, losses: 0, best: 0, hauntLevel: 0, streakSkins: [] };
let ownSpawnStart = 0; // performance.now() when my tank materialised this round

const POWERUP_META = {
    speed: { color: '#00e5ff', label: 'S', name: 'SPEED' },
    rapid: { color: '#ff9100', label: 'F', name: 'RAPID FIRE' },
    triple: { color: '#b388ff', label: 'T', name: 'TRIPLE SHOT' },
    ricochet: { color: '#ffd600', label: 'R', name: 'RICOCHET' },
    shield: { color: '#2979ff', label: 'B', name: 'SHIELD' },
    laser: { color: '#ff1744', label: 'L', name: 'LASER' },
};

// ---- Tank design (cosmetic) ----
const DEFAULT_DESIGN = { name: '', hull: 'classic', turret: 'square', barrel: 'medium', treads: 'treads', color: '#FF4136', skin: null, trail: null, boom: null, spawn: null };
const sanitizeName = (v) => String(v || '').replace(/[^\w -]/g, '').slice(0, 4);
const BARREL_LEN = { short: 10, medium: 18, long: 26 };
const PART_LABELS = { hull: 'Hull', turret: 'Turret', barrel: 'Barrel' };
const COSMETIC_CATS = ['skin', 'trail', 'boom', 'spawn'];

let palette = [];
let parts = {};
let design = { ...DEFAULT_DESIGN };
try {
    const saved = JSON.parse(localStorage.getItem('tankDesign') || 'null');
    if (saved && typeof saved === 'object') Object.assign(design, saved);
} catch {}
design.treads = 'treads';
design.name = sanitizeName(design.name);
for (const cat of COSMETIC_CATS) if (!design[cat]) design[cat] = null;

const garageEl = document.getElementById('garage');
const previewCtx = document.getElementById('preview').getContext('2d');
const garageControls = document.getElementById('garageControls');
const garageForgeCol = document.getElementById('garageForgeCol');
const garageDoneEl = document.getElementById('garageDone');
const garageErrorEl = document.getElementById('garageError');
let nameInputEl = null;

// A callsign is required to deploy. Keep the hint visible while the field is
// empty and focus it on a blocked deploy so the fix is obvious.
function refreshDeployState() {
    if (design.name) garageErrorEl.classList.add('hidden');
    else garageErrorEl.classList.remove('hidden');
}
function openGarage() {
    garageEl.classList.remove('hidden');
    drawPreview();
    refreshDeployState();
    if (!design.name && nameInputEl) nameInputEl.focus();
}

function shade(hex, factor) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * factor);
    const g = Math.round(((n >> 8) & 255) * factor);
    const b = Math.round((n & 255) * factor);
    return `rgb(${r},${g},${b})`;
}

function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
}

function hullPath(g, shape) {
    if (shape === 'wedge') {
        g.beginPath();
        g.moveTo(-14, -11);
        g.lineTo(8, -11);
        g.lineTo(14, 0);
        g.lineTo(8, 11);
        g.lineTo(-14, 11);
        g.closePath();
    } else if (shape === 'round') {
        roundRect(g, -14, -11, 28, 22, 8);
    } else {
        roundRect(g, -14, -11, 28, 22, 4);
    }
}

function streakSkinFor(best) {
    let out = null;
    for (const s of streakSkinDefs) if (best >= s.at) out = s.id;
    return out;
}

function drawTank(g, d, turretOffset = 0, streak = null, recoil = 0) {
    let body = d.color;
    if (d.skin === 'skin_camo') body = '#6b7d3a';
    else if (d.skin === 'skin_neon') body = '#00e5ff';
    else if (d.skin === 'skin_ghost') body = '#c9c3aa';
    else if (d.skin === 'skin_chrome') body = '#b8c0c8';
    else if (d.skin === 'skin_ember') body = '#ff6d3a';
    if (streak === 'golden') body = '#d4af37';
    else if (streak === 'titanium') body = '#e8edf2';
    const dark = shade(body, 0.6);
    const mid = shade(body, 0.82);
    const phantom = streak === 'phantom' || d.skin === 'skin_ghost';

    if (d.treads === 'treads') {
        for (const ty of [-15, 9]) {
            roundRect(g, -15, ty, 30, 6, 2.5);
            g.fillStyle = '#454d5c';
            g.fill();
            g.fillStyle = '#20242c';
            for (const tx of [-11, -6, -1, 4, 9]) g.fillRect(tx, ty + 1.5, 2, 3);
        }
    } else if (d.treads === 'wheels') {
        g.fillStyle = '#454d5c';
        for (const wx of [-10, 0, 10]) {
            g.beginPath(); g.arc(wx, -12.5, 3.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.arc(wx, 12.5, 3.5, 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = '#20242c';
        for (const wx of [-10, 0, 10]) {
            g.beginPath(); g.arc(wx, -12.5, 1.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.arc(wx, 12.5, 1.5, 0, Math.PI * 2); g.fill();
        }
    }

    g.save();
    if (phantom) g.globalAlpha = 0.55;
    hullPath(g, d.hull);
    if (d.hull === 'wedge') {
        g.strokeStyle = body;
        g.lineJoin = 'round';
        g.lineWidth = 4;
        g.stroke();
    }
    g.fillStyle = body;
    g.fill();
    hullPath(g, d.hull);
    g.clip();
    g.fillStyle = mid;
    g.fillRect(-15, -14, 30, 7);
    g.restore();

    // scarred: battle scratches across the armor
    if (streak === 'scarred') {
        g.save();
        g.strokeStyle = 'rgba(20,24,14,0.85)';
        g.lineWidth = 1.2;
        g.beginPath();
        g.moveTo(-10, -4); g.lineTo(-3, 1); g.lineTo(-7, 7);
        g.moveTo(3, -8); g.lineTo(10, -2); g.lineTo(6, 5);
        g.moveTo(-1, -2); g.lineTo(5, 3);
        g.stroke();
        g.restore();
    }
    // golden/titanium: accent trim
    if (streak === 'golden' || streak === 'titanium') {
        g.save();
        hullPath(g, d.hull);
        g.strokeStyle = streak === 'golden' ? '#ffd600' : '#9fb4c8';
        g.lineWidth = 1.6;
        g.stroke();
        g.restore();
    }

    // turret + barrel rotate independently of the hull
    g.save();
    if (phantom) g.globalAlpha = 0.55;
    g.rotate(turretOffset);
    g.fillStyle = dark;
    if (d.turret === 'round') {
        g.beginPath(); g.arc(1, 0, 8, 0, Math.PI * 2); g.fill();
    } else if (d.turret === 'dome') {
        g.beginPath(); g.arc(1, 0, 9, 0, Math.PI * 2); g.fill();
        g.fillStyle = mid;
        g.beginPath(); g.arc(1, 0, 5, 0, Math.PI * 2); g.fill();
    } else {
        roundRect(g, -5, -8, 14, 16, 3);
        g.fill();
    }

    const bl = BARREL_LEN[d.barrel] || BARREL_LEN.medium;
    const bx = 5 - recoil;
    g.fillStyle = dark;
    roundRect(g, bx, -3, bl, 6, 3);
    g.fill();
    g.fillStyle = mid;
    roundRect(g, bx, -3, bl, 2, 1);
    g.fill();
    g.fillStyle = '#111';
    roundRect(g, bx + bl - 3, -4, 3, 8, 1.5);
    g.fill();
    g.restore();
}

function drawPreview() {
    const w = previewCtx.canvas.width;
    const h = previewCtx.canvas.height;
    previewCtx.clearRect(0, 0, w, h);
    previewCtx.save();
    previewCtx.translate(w / 2, h / 2);
    previewCtx.scale(2.6, 2.6);
    drawTank(previewCtx, design, 0, streakSkinFor(bankInfo.best));
    previewCtx.restore();
}

function buildGarage() {
    garageControls.innerHTML = '';

    const roomRow = document.createElement('div');
    roomRow.className = 'garageRow';
    const roomLabel = document.createElement('span');
    roomLabel.className = 'garageLabel';
    roomLabel.textContent = 'Room';
    roomRow.appendChild(roomLabel);
    const roomVal = document.createElement('span');
    roomVal.textContent = roomCode || '----';
    roomVal.style.color = 'var(--amber)';
    roomVal.style.letterSpacing = '0.24em';
    roomRow.appendChild(roomVal);
    const roomInput = document.createElement('input');
    roomInput.className = 'garageName';
    roomInput.maxLength = 4;
    roomInput.placeholder = 'CODE';
    roomInput.autocomplete = 'off';
    roomInput.spellcheck = false;
    roomInput.style.width = '72px';
    roomRow.appendChild(roomInput);
    const roomJoin = document.createElement('button');
    roomJoin.className = 'garageOpt';
    roomJoin.textContent = 'Join';
    roomJoin.onclick = () => {
        const c = roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
        if (c && c !== roomCode) location.search = `?room=${c}`;
    };
    roomRow.appendChild(roomJoin);
    garageControls.appendChild(roomRow);

    const nameRow = document.createElement('div');
    nameRow.className = 'garageRow';
    const nameLabel = document.createElement('span');
    nameLabel.className = 'garageLabel';
    nameLabel.textContent = 'Name';
    nameRow.appendChild(nameLabel);
    const nameInput = document.createElement('input');
    nameInput.className = 'garageName';
    nameInput.maxLength = 4;
    nameInput.value = design.name || '';
    nameInput.placeholder = 'REQUIRED';
    nameInput.autocomplete = 'off';
    nameInput.spellcheck = false;
    nameInput.oninput = () => {
        design.name = sanitizeName(nameInput.value);
        if (nameInput.value !== design.name) nameInput.value = design.name;
        refreshDeployState();
        sendDesign();
    };
    nameRow.appendChild(nameInput);
    garageControls.appendChild(nameRow);
    nameInputEl = nameInput;

    for (const key of Object.keys(PART_LABELS)) {
        const row = document.createElement('div');
        row.className = 'garageRow';
        const label = document.createElement('span');
        label.className = 'garageLabel';
        label.textContent = PART_LABELS[key];
        row.appendChild(label);
        const opts = document.createElement('div');
        opts.className = 'garageOpts';
        for (const opt of parts[key] || []) {
            const btn = document.createElement('button');
            btn.className = 'garageOpt' + (design[key] === opt ? ' selected' : '');
            btn.textContent = opt;
            btn.onclick = () => { design[key] = opt; buildGarage(); sendDesign(); };
            opts.appendChild(btn);
        }
        row.appendChild(opts);
        garageControls.appendChild(row);
    }

    const row = document.createElement('div');
    row.className = 'garageRow';
    const label = document.createElement('span');
    label.className = 'garageLabel';
    label.textContent = 'Color';
    row.appendChild(label);
    const opts = document.createElement('div');
    opts.className = 'garageOpts';
    for (const c of palette) {
        const btn = document.createElement('button');
        btn.className = 'garageSwatch' + (design.color === c.hex ? ' selected' : '');
        btn.style.background = c.hex;
        btn.title = c.name;
        btn.onclick = () => { design.color = c.hex; buildGarage(); sendDesign(); };
        opts.appendChild(btn);
    }
    row.appendChild(opts);
    garageControls.appendChild(row);

    const ctrlRow = document.createElement('div');
    ctrlRow.className = 'garageRow';
    const ctrlLabel = document.createElement('span');
    ctrlLabel.className = 'garageLabel';
    ctrlLabel.textContent = 'Controls';
    ctrlRow.appendChild(ctrlLabel);
    const ctrlOpts = document.createElement('div');
    ctrlOpts.className = 'garageOpts';
    for (const mode of ['aim', 'classic']) {
        const btn = document.createElement('button');
        btn.className = 'garageOpt' + (controlMode === mode ? ' selected' : '');
        btn.textContent = mode === 'aim' ? 'Aim' : 'Classic';
        btn.onclick = () => {
            controlMode = mode;
            localStorage.setItem('controlMode', mode);
            applyControlMode();
            buildGarage();
        };
        ctrlOpts.appendChild(btn);
    }
    ctrlRow.appendChild(ctrlOpts);
    garageControls.appendChild(ctrlRow);

    pushForge();

    drawPreview();
    refreshDeployState();
}

function applyCatalog(data) {
    palette = Array.isArray(data.palette) ? data.palette : [];
    parts = data.parts && typeof data.parts === 'object' ? data.parts : {};
    for (const key of Object.keys(PART_LABELS)) {
        if (!Array.isArray(parts[key]) || !parts[key].includes(design[key])) design[key] = DEFAULT_DESIGN[key];
    }
    if (!palette.some((c) => c.hex === design.color)) design.color = DEFAULT_DESIGN.color;
    buildGarage();
}

function sendDesign() {
    localStorage.setItem('tankDesign', JSON.stringify(design));
    sendWs({ type: 'design', design });
}

garageDoneEl.onclick = () => {
    if (!design.name) {
        garageErrorEl.classList.remove('hidden');
        if (nameInputEl) nameInputEl.focus();
        return;
    }
    garageEl.classList.add('hidden');
};

// ---- Trash talk: audio ----
let audioCtx = null;
function ensureAudio() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { try { audioCtx = new AC(); } catch {} }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
['pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
    window.addEventListener(ev, ensureAudio, { passive: true })
);

function tone(freq, start, dur, type, peak) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak || 0.12, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.03);
}

function sweep(f0, f1, start, dur, type, peak) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(f0, start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), start + dur);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak || 0.12, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.03);
}

const EMOTE_SOUNDS = {
    GG: (t) => { tone(523, t, 0.1, 'triangle', 0.14); tone(784, t + 0.11, 0.16, 'triangle', 0.14); },
    REKT: (t) => { tone(330, t, 0.12, 'sawtooth', 0.12); tone(247, t + 0.12, 0.12, 'sawtooth', 0.12); tone(165, t + 0.24, 0.28, 'sawtooth', 0.12); },
    'NICE!': (t) => { tone(523, t, 0.09, 'square', 0.11); tone(659, t + 0.09, 0.09, 'square', 0.11); tone(880, t + 0.18, 0.18, 'square', 0.11); },
    LOL: (t) => { [0, 0.09, 0.18, 0.27].forEach((d, i) => tone(i % 2 ? 988 : 880, t + d, 0.07, 'square', 0.1)); },
    EZ: (t) => { tone(660, t, 0.14, 'triangle', 0.13); tone(440, t + 0.15, 0.22, 'triangle', 0.13); },
    OOPS: (t) => { sweep(600, 160, t, 0.4, 'sine', 0.14); },
    'HeHeHe...': (t) => {
        // high, wobbling cackle that slides down into a long "haaa"
        for (let i = 0; i < 11; i++) {
            const base = 900 - i * 16 + Math.sin(i * 1.9) * 70;
            const start = t + i * 0.1;
            tone(base, start, 0.055, 'triangle', 0.13);
            tone(base * 1.5, start + 0.006, 0.045, 'sawtooth', 0.05);
        }
        sweep(760, 300, t + 11 * 0.1, 0.34, 'triangle', 0.13);
    },
};

function playTauntSound(text) {
    ensureAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime + 0.01;
    const fn = EMOTE_SOUNDS[text];
    if (fn) { fn(t); return; }
    let hash = 0;
    for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
    const base = 380 + (hash % 7) * 90;
    tone(base, t, 0.09, 'square', 0.1);
    tone(base * 1.5, t + 0.09, 0.12, 'square', 0.1);
}

function playExplosionSound(seed) {
    ensureAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime + 0.01;
    const dur = 0.55;
    // filtered noise burst = the crunch
    const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
        const env = Math.pow(1 - i / data.length, 2);
        data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = 0.9 + (seed % 5) * 0.05;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1600, t);
    filter.frequency.exponentialRampToValueAtTime(140, t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(g).connect(audioCtx.destination);
    src.start(t);
    // sub-bass thump underneath
    sweep(140 + (seed % 4) * 12, 38, t, 0.4, 'sine', 0.32);
}

// Cannon fire: a deep pitch-dropping thump, a low-passed muzzle blast, and a crack.
function playFireSound() {
    ensureAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime + 0.005;

    // main boom: low sine sliding down = the body of the report
    sweep(160, 34, t, 0.3, 'sine', 0.42);
    // chest-punch transient
    tone(120, t, 0.07, 'triangle', 0.28);

    // muzzle blast: filtered noise burst that closes down fast
    const dur = 0.22;
    const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
        const env = Math.pow(1 - i / data.length, 3);
        data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1400, t);
    filter.frequency.exponentialRampToValueAtTime(120, t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(g).connect(audioCtx.destination);
    src.start(t);
    src.stop(t + dur + 0.02);
}

// Hit feedback: a hit you land, a kill, an absorbed shot, or taking damage.
function playHitSound(kind) {
    ensureAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime + 0.005;
    if (kind === 'confirm') {
        tone(1250, t, 0.05, 'square', 0.09);
        tone(1750, t + 0.035, 0.05, 'square', 0.07);
    } else if (kind === 'kill') {
        tone(900, t, 0.05, 'square', 0.1);
        tone(1350, t + 0.045, 0.06, 'square', 0.1);
        tone(1900, t + 0.1, 0.09, 'square', 0.09);
    } else if (kind === 'absorb') {
        sweep(1800, 900, t, 0.09, 'square', 0.09); // metallic tink
    } else if (kind === 'hurt') {
        sweep(240, 80, t, 0.22, 'sawtooth', 0.2);
        tone(70, t, 0.2, 'sine', 0.18);
    }
}

const keys = {};
let inputDx = 0, inputDy = 0, inputFire = false;

window.addEventListener('keydown', (e) => { if (e.target && e.target.tagName === 'INPUT') return; keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function computeKeyboardVector() {
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    // possessed: lateral controls scramble on a timer for the first ~10s
    if (performance.now() < scrambleUntil) dx *= scrambleFlip;
    return { dx, dy };
}
let keyboardFire = false;
window.addEventListener('keydown', (e) => { if (e.target && e.target.tagName === 'INPUT') return; if (e.key === ' ') keyboardFire = true; });

// ---- Control mode + independent aim ----
let controlMode = localStorage.getItem('controlMode') || 'classic';
let mouseFire = false;
let mouseX = null, mouseY = null;
let aimTouchId = null, stickAim = 0, stickFiring = false;

function canvasPoint(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
        x: (clientX - r.left) * (canvas.width / r.width),
        y: (clientY - r.top) * (canvas.height / r.height),
    };
}
canvas.addEventListener('mousemove', (e) => {
    const pt = canvasPoint(e.clientX, e.clientY);
    mouseX = pt.x;
    mouseY = pt.y;
});
canvas.addEventListener('mousedown', (e) => { if (e.button === 0) mouseFire = true; });
window.addEventListener('mouseup', (e) => { if (e.button === 0) mouseFire = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('blur', () => { mouseFire = false; });

// ---- Touch controls (shown only on touch devices) ----
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const moveStick = document.getElementById('moveStick');
const knob = moveStick.querySelector('.knob');
const aimStick = document.getElementById('aimStick');
const aimKnob = aimStick.querySelector('.knob');
const fireBtn = document.getElementById('fireBtn');
// Knob travel is derived from the stick's rendered size, so the controls can
// resize with the viewport instead of assuming a fixed 124px stick.
function knobRest(stickEl, knobEl) {
    const r = stickEl.getBoundingClientRect();
    return Math.max(0, (r.width - knobEl.offsetWidth) / 2);
}
function centerKnob(stickEl, knobEl) {
    const rest = knobRest(stickEl, knobEl);
    knobEl.style.left = `${rest}px`;
    knobEl.style.top = `${rest}px`;
}
function layoutSticks() {
    centerKnob(moveStick, knob);
    centerKnob(aimStick, aimKnob);
}
let stickDx = 0, stickDy = 0, stickActive = false, stickTouchId = null;
let touchFire = false;

// Show/hide the touch controls for the active mode (twin-stick vs fire button).
function applyControlMode() {
    if (!isTouch) return;
    const aimMode = controlMode === 'aim';
    moveStick.style.display = 'block';
    aimStick.style.display = aimMode ? 'block' : 'none';
    fireBtn.style.display = aimMode ? 'none' : 'flex';
    layoutSticks();
}

if (isTouch) {
    document.getElementById('help').style.display = 'none';
    applyControlMode();

    moveStick.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        stickTouchId = t.identifier;
        stickActive = true;
        updateStick(t);
    });
    moveStick.addEventListener('touchmove', (e) => {
        for (const t of e.changedTouches) {
            if (t.identifier === stickTouchId) updateStick(t);
        }
    });
    moveStick.addEventListener('touchend', resetStick);
    moveStick.addEventListener('touchcancel', resetStick);

    function updateStick(t) {
        const rect = moveStick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = (t.clientX - cx) / (rect.width / 2);
        let dy = (t.clientY - cy) / (rect.height / 2);
        const len = Math.hypot(dx, dy);
        if (len > 1) { dx /= len; dy /= len; }
        stickDx = dx; stickDy = dy;
        const rest = knobRest(moveStick, knob);
        knob.style.left = `${rest + dx * rest}px`;
        knob.style.top = `${rest + dy * rest}px`;
    }
    function resetStick() {
        stickActive = false;
        stickTouchId = null;
        stickDx = 0; stickDy = 0;
        centerKnob(moveStick, knob);
    }

    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); touchFire = true; });
    fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); touchFire = false; });
    fireBtn.addEventListener('touchcancel', () => { touchFire = false; });

    // right stick: aim + auto-fire while held
    aimStick.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        aimTouchId = t.identifier;
        updateAimStick(t);
    });
    aimStick.addEventListener('touchmove', (e) => {
        for (const t of e.changedTouches) if (t.identifier === aimTouchId) updateAimStick(t);
    });
    aimStick.addEventListener('touchend', resetAimStick);
    aimStick.addEventListener('touchcancel', resetAimStick);

    function updateAimStick(t) {
        const rect = aimStick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = (t.clientX - cx) / (rect.width / 2);
        let dy = (t.clientY - cy) / (rect.height / 2);
        const len = Math.hypot(dx, dy);
        if (len < 0.25) {
            stickFiring = false;
            centerKnob(aimStick, aimKnob);
            return;
        }
        if (len > 1) { dx /= len; dy /= len; }
        stickAim = Math.atan2(dy, dx);
        stickFiring = true;
        const rest = knobRest(aimStick, aimKnob);
        aimKnob.style.left = `${rest + dx * rest}px`;
        aimKnob.style.top = `${rest + dy * rest}px`;
    }
    function resetAimStick() {
        aimTouchId = null;
        stickFiring = false;
        centerKnob(aimStick, aimKnob);
    }

    window.addEventListener('resize', layoutSticks);
    window.addEventListener('orientationchange', layoutSticks);
}

// ---- Networking ----
function handleMessage(event) {
    const data = JSON.parse(event.data);
    if (data.type === 'init') {
        myId = data.id;
        roomCode = data.roomCode || roomCode || '';
        if (roomCode && !roomParam) {
            // remember the minted code in the URL so a refresh rejoins this room
            try { history.replaceState(null, '', `?room=${roomCode}`); } catch (e) {}
        }
        arena = data.arena;
        obstacles = data.obstacles;
        mapName = data.mapName || '';
        canvas.width = arena.w;
        canvas.height = arena.h;
        shopItems = Array.isArray(data.shop) ? data.shop : [];
        mapsList = Array.isArray(data.maps) ? data.maps : [];
        streakSkinDefs = Array.isArray(data.streakSkins) ? data.streakSkins : [];
        applyCatalog(data);
        sendDesign();
        buildForge();
    } else if (data.type === 'bank') {
        bankInfo = {
            bolts: data.bolts,
            owned: data.owned || [],
            bought: data.bought || {},
            streak: data.streak || 0,
            wins: data.wins || 0,
            losses: data.losses || 0,
            best: data.best || 0,
            hauntLevel: data.hauntLevel || 0,
            streakSkins: data.streakSkins || [],
        };
        const r = data.reason;
        if (r && typeof r === 'object' && r.type === 'kill') {
            boltNote(`+${r.amount} ⚡ kill${r.firstBlood ? ' · first blood +2' : ''}${r.amount > 4 ? ' · streak!' : ''}`);
        } else if (r && typeof r === 'object' && r.type === 'death') {
            boltNote(`${r.amount} ⚡ death tax`, 'neg');
        } else if (r && typeof r === 'object' && (r.type === 'round' || r.type === 'match')) {
            if (r.amount > 0 && r.win) boltNote(`+${r.amount} ⚡ ${r.type === 'match' ? 'match won' : 'round won'}`);
            else boltNote(`${r.amount} ⚡ ${r.type === 'match' ? 'match lost' : 'round lost'}`, 'neg');
        } else if (r && typeof r === 'object' && r.type === 'bought') {
            boltNote('equipped · forged');
            // a bought cosmetic is applied server-side already; keep local design in sync
            const it = shopItems.find((i) => i.id === r.itemId);
            if (it && it.cat !== 'consumable') {
                design[it.cat] = it.id;
                localStorage.setItem('tankDesign', JSON.stringify(design));
                drawPreview();
            }
        } else if (r && typeof r === 'object' && r.type === 'boughtFail') {
            boltNote('not enough bolts', 'neg');
        } else if (r && typeof r === 'object' && r.type === 'mapvoted') {
            boltNote('map vote cast');
        } else if (r && typeof r === 'object' && r.type === 'immunityUsed') {
            boltNote('haunt shield consumed', 'atk');
        }
        buildForge();
    } else if (data.type === 'full') {
        showLobby(`Room ${roomCode} is full — pick another`);
        if (ws) { try { ws.close(); } catch (e) {} }
    } else if (data.type === 'notfound') {
        showLobby(data.roomCode ? `Room ${data.roomCode} not found — pick another` : 'Room not found');
        if (ws) { try { ws.close(); } catch (e) {} }
    } else if (data.type === 'map') {
        obstacles = data.obstacles;
        mapName = data.name || mapName;
    } else if (data.type === 'state') {
        for (const id in data.players) {
            const tp = data.players[id].taunt;
            if (tp && seenTaunts[id] !== tp.at) {
                seenTaunts[id] = tp.at;
                tauntAnims[id] = { start: performance.now() };
                playTauntSound(tp.text);
            }
        }
        players = data.players;
        for (const id in players) {
            const prev = lastHp[id];
            if (prev !== undefined && players[id].hp < prev) hitFlash[id] = performance.now();
            lastHp[id] = players[id].hp;
        }
        bullets = data.bullets;
        holes = data.holes || [];
        explosions = data.explosions || [];
        for (const ex of explosions) {
            if (!seenBooms.has(ex.id)) {
                seenBooms.add(ex.id);
                boomAnims[ex.id] = { start: performance.now(), x: ex.x, y: ex.y, color: ex.color, seed: ex.id, boom: ex.boom };
                playExplosionSound(ex.id);
                // a destroyed tank rattles the camera: heavy up close, light far off
                const me = myId ? players[myId] : null;
                const d = me ? Math.hypot(ex.x - me.x, ex.y - me.y) : 0;
                const prox = Math.max(0, 1 - d / 420);
                const mag = 5 + 9 * prox;
                const until = performance.now() + 240;
                if (until > shakeUntil) { shakeUntil = until; shakeDur = 240; shakeMag = Math.max(shakeMag, mag); }
            }
        }
        const liveBooms = new Set(explosions.map((e) => e.id));
        for (const id of seenBooms) if (!liveBooms.has(id)) seenBooms.delete(id);
        for (const id in boomAnims) if (!liveBooms.has(Number(id))) delete boomAnims[id];

        const hitsIn = data.hitEvents || [];
        for (const h of hitsIn) {
            if (seenHits.has(h.id)) continue;
            seenHits.add(h.id);
            const victim = players[h.target];
            const color = (victim && victim.design && victim.design.color) || '#e0a938';
            if (h.by === myId) {
                hitMark = { start: performance.now(), kill: h.kind === 'kill' };
                playHitSound(h.kind === 'kill' ? 'kill' : h.kind === 'absorbed' ? 'absorb' : 'confirm');
            }
            if (h.target === myId) {
                hurtFlashAt = performance.now();
                shakeUntil = performance.now() + 160;
                shakeDur = 160;
                shakeMag = h.kind === 'kill' ? 6 : 4;
                playHitSound('hurt');
            }
            damageNumbers.push({
                x: h.x, y: h.y, start: performance.now(),
                text: h.kind === 'absorbed' ? 'BLOCK' : '-1',
                color: h.kind === 'absorbed' ? '#7FDBFF' : color,
            });
        }
        const liveHits = new Set(hitsIn.map((e) => e.id));
        for (const id of seenHits) if (!liveHits.has(id)) seenHits.delete(id);

        const firesIn = data.fireEvents || [];
        for (const f of firesIn) {
            if (seenFires.has(f.id)) continue;
            seenFires.add(f.id);
            playFireSound();
            muzzleFlashes.push({ x: f.x, y: f.y, angle: f.angle, start: performance.now(), by: f.by });
            barrelKick[f.by] = performance.now();
            // a camera kick on every shot: strongest for your own cannon
            const me = myId ? players[myId] : null;
            const fd = me ? Math.hypot(f.x - me.x, f.y - me.y) : 0;
            const fmag = 1.5 + 3 * Math.max(0, 1 - fd / 500);
            const funtil = performance.now() + 100;
            if (funtil > shakeUntil) { shakeUntil = funtil; shakeDur = 100; shakeMag = Math.max(shakeMag, fmag); }
        }
        const liveFires = new Set(firesIn.map((f) => f.id));
        for (const id of seenFires) if (!liveFires.has(id)) seenFires.delete(id);

        powerup = data.powerup;
        powerupNext = data.powerupNext || null;
        if (data.match) matchInfo = data.match;
        const justStarted = (data.round.state === 'active' || data.round.state === 'sudden')
            && prevRoundState !== 'active' && prevRoundState !== 'sudden';
        if (justStarted) {
            roundActiveStart = performance.now();
            ownSpawnStart = performance.now();
            hauntConsumedThisRound = false;
            const me = myId ? data.players[myId] : null;
            const lv = me ? (me.hauntLevel || 0) : 0;
            if (lv > 0) {
                const immune = (bankInfo.bought.immunity || 0) >= 1;
                if (immune) {
                    hauntConsumedThisRound = true;
                    sendWs({ type: 'immunity' });
                }
                applyHaunt(lv, immune);
            }
        }
        const meNow = myId ? data.players[myId] : null;
        if (meNow && hauntActive && (meNow.hauntLevel || 0) <= 0) clearHauntFx();
        prevRoundState = data.round.state;
        roundInfo = data.round;
    }
}

    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (!garageEl.classList.contains('hidden') || chatOpen) {
        sendWs({ type: 'input', dx: 0, dy: 0, fire: false });
        return;
    }
    const kb = computeKeyboardVector();
    const dx = kb.dx !== 0 ? kb.dx : stickDx;
    const dy = kb.dy !== 0 ? kb.dy : stickDy;
    let fire = keyboardFire || touchFire;
    let aim = null;
    if (controlMode === 'aim') {
        const mine = myId ? players[myId] : null;
        if (isTouch) {
            if (stickFiring) { aim = stickAim; fire = true; }
        } else if (mine && mouseX !== null) {
            aim = Math.atan2(mouseY - mine.y, mouseX - mine.x);
            fire = fire || mouseFire;
        }
    }
    const msg = { type: 'input', dx, dy, fire };
    if (aim !== null) msg.aim = aim;
    sendWs(msg);
}, 1000 / 30);

function boltNote(text, cls) {
    if (!boltFeedEl) return;
    const el = document.createElement('div');
    el.className = 'boltNote' + (cls ? ' ' + cls : '');
    el.textContent = text;

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
}

            cost.className = 'fc';

            else if (owned) cost.textContent = equip ? 'Equipped' : 'Equip';

            if (it.desc) {
