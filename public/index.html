<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Tank Duel</title>
<style>
    :root {
        --bg: #0b0c0a;
        --panel: #13150f;
        --line: #2b2f22;
        --line2: #454b33;
        --text: #d9d6c4;
        --muted: #8c8b76;
        --amber: #e0a938;
        --amber-dim: #8a6a24;
        --olive: #7f8a52;
        --red: #c14b32;
        --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(120% 100% at 50% 0%, #14160f 0%, #0b0c0a 70%);
        color: var(--text);
        font-family: var(--mono);
        letter-spacing: 0.04em;
        overflow: hidden;
        touch-action: none;
        user-select: none;
    }
    #wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #brand {
        position: absolute;
        top: 13px;
        left: 16px;
        z-index: 6;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--olive);
        pointer-events: none;
    }
    #hud {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 12px 16px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(11,12,10,0.92), rgba(11,12,10,0));
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        z-index: 5;
    }
    #hud span { display: flex; align-items: center; gap: 8px; }
    #timer { font-size: 16px; font-weight: 700; color: var(--amber); }
    #status { color: var(--muted); }
    #myBuff { color: var(--amber); }
    #banner {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(22px, 5vw, 40px);
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-align: center;
        white-space: pre-line;
        color: var(--text);
        text-shadow: 0 0 18px rgba(0,0,0,0.9), 0 2px 0 #000;
        z-index: 6;
        pointer-events: none;
    }
    canvas {
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 8px;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 24px 60px rgba(0,0,0,0.6), inset 0 0 120px rgba(0,0,0,0.5);
        max-width: 100vw;
        max-height: 100vh;
        touch-action: none;
    }
    .stick {
        position: fixed;
        bottom: 28px;
        width: 124px;
        height: 124px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, rgba(224,169,56,0.06), rgba(0,0,0,0.25));
        border: 1px solid var(--line2);
        z-index: 10;
        display: none;
    }
    .stick .knob {
        position: absolute;
        width: 52px;
        height: 52px;
        left: 36px;
        top: 36px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, rgba(224,169,56,0.55), rgba(224,169,56,0.18));
        border: 1px solid rgba(224,169,56,0.7);
    }
    #moveStick { left: 28px; }
    #aimStick { right: 28px; }
    #fireBtn {
        right: 28px;
        display: none;
        position: fixed;
        bottom: 28px;
        width: 94px;
        height: 94px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, rgba(193,75,50,0.35), rgba(193,75,50,0.1));
        border: 1px solid rgba(193,75,50,0.8);
        color: #f3d9d1;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: 0.18em;
        z-index: 10;
        align-items: center;
        justify-content: center;
        font-size: 13px;
    }
    #help {
        position: absolute;
        bottom: 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.7;
        z-index: 5;
    }
    @media (max-width: 560px) {
        #brand { display: none; }
    }
    #customizeBtn {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 20;
        background: transparent;
        border: 1px solid var(--line2);
        color: var(--text);
        border-radius: 6px;
        padding: 7px 12px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    #customizeBtn:hover { border-color: var(--amber); color: var(--amber); background: rgba(224,169,56,0.06); }
    #garage {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: radial-gradient(120% 120% at 50% 0%, rgba(20,22,15,0.96), rgba(5,6,4,0.98));
    }
    #garage.hidden { display: none; }
    #garageCard {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 22px 24px 20px;
        width: min(600px, 100%);
        max-height: 100%;
        overflow-y: auto;
        box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    #garageCard::before, #garageCard::after {
        content: '';
        position: absolute;
        width: 14px;
        height: 14px;
        border: 1px solid var(--amber);
        opacity: 0.75;
    }
    #garageCard::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
    #garageCard::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
    #garageCard h1 {
        margin: 0 0 4px;
        font-size: 15px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
        color: var(--text);
    }
    #garageCard .sub {
        margin: 0 0 18px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
    }
    #garageBody {
        display: flex;
        gap: 22px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
    }
    #preview {
        background:
            linear-gradient(rgba(127,138,82,0.06) 1px, transparent 1px) 0 0 / 100% 20px,
            linear-gradient(90deg, rgba(127,138,82,0.06) 1px, transparent 1px) 0 0 / 20px 100%,
            #0f1109;
        border: 1px solid var(--line2);
        border-radius: 8px;
        flex: 0 0 auto;
    }
    #garageControls { flex: 1 1 260px; min-width: 0; }
    .garageRow { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .garageLabel { width: 54px; flex: 0 0 auto; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .garageOpts { display: flex; flex-wrap: wrap; gap: 6px; }
    .garageName {
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 5px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 7px 10px;
        width: 120px;
        outline: none;
    }
    .garageName:focus { border-color: var(--amber); }
    .garageName::placeholder { color: var(--muted); opacity: 0.6; }
    .garageOpt {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line2);
        border-radius: 5px;
        padding: 7px 11px;
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.12s;
    }
    .garageOpt:hover { border-color: var(--amber-dim); }
    .garageOpt.selected { background: var(--amber); border-color: var(--amber); color: #141509; font-weight: 700; }
    .garageSwatch {
        width: 28px;
        height: 28px;
        border-radius: 5px;
        border: 1px solid rgba(0,0,0,0.5);
        box-shadow: 0 0 0 1px var(--line2);
        cursor: pointer;
        padding: 0;
        transition: box-shadow 0.12s, transform 0.12s;
    }
    .garageSwatch:hover { transform: translateY(-1px); }
    .garageSwatch.selected { box-shadow: 0 0 0 2px var(--amber); }
    #garageDone {
        display: block;
        margin: 20px auto 0;
        background: var(--amber);
        color: #141509;
        border: none;
        border-radius: 6px;
        padding: 11px 40px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        cursor: pointer;
    }
    #garageDone:hover { filter: brightness(1.08); }
    #garageError {
        margin: 14px 0 0;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--red);
    }
    #garageError.hidden { display: none; }
    #scoreboard {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5,6,4,0.72);
        backdrop-filter: blur(2px);
    }
    #scoreboard.hidden { display: none; }
    #scoreCard {
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 18px 22px 14px;
        min-width: min(440px, 92vw);
        box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    #scoreCard h2 {
        margin: 0 0 12px;
        font-size: 13px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-align: center;
        color: var(--amber);
    }
    #scoreCard table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #scoreCard th {
        text-align: right;
        padding: 5px 8px;
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
    }
    #scoreCard th:nth-child(2) { text-align: left; }
    #scoreCard td {
        text-align: right;
        padding: 6px 8px;
        font-variant-numeric: tabular-nums;
        border-bottom: 1px solid rgba(43,47,34,0.5);
    }
    #scoreCard td:nth-child(2) { text-align: left; font-weight: 700; }
    #scoreCard tr.me td { color: var(--amber); }
    #scoreCard tr.out td { opacity: 0.5; }
    .scoreSwatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        border: 1px solid rgba(0,0,0,0.5);
    }
    .scoreHint {
        margin: 12px 0 0;
        text-align: center;
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
    }
    #emoteBar {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        z-index: 12;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        padding: 6px;
        max-width: calc(100vw - 20px);
        border-radius: 10px;
        background: rgba(11,12,10,0.72);
        border: 1px solid var(--line);
        backdrop-filter: blur(3px);
    }
    #emoteBar.hidden { display: none; }
    .emoteBtn {
        min-width: 46px;
        height: 38px;
        padding: 0 8px;
        border-radius: 7px;
        background: transparent;
        border: 1px solid var(--line2);
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: border-color 0.12s, color 0.12s, transform 0.08s, background 0.12s;
    }
    .emoteBtn:hover { border-color: var(--amber); color: var(--amber); background: rgba(224,169,56,0.08); }
    .emoteBtn:active { transform: scale(0.9); }
    .emoteBtn .k { display: block; font-size: 8px; font-weight: 400; color: var(--muted); letter-spacing: 0.1em; }
    #chatBar {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        z-index: 13;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: rgba(11,12,10,0.94);
        border: 1px solid var(--amber-dim);
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    #chatBar.hidden { display: none; }
    #chatInput {
        width: min(46vw, 320px);
        background: #0f1109;
        border: 1px solid var(--line2);
        border-radius: 6px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.08em;
        padding: 8px 10px;
        outline: none;
    }
    #chatInput:focus { border-color: var(--amber); }
    #chatInput::placeholder { color: var(--muted); opacity: 0.6; }
    #chatSend {
        background: var(--amber);
        color: #141509;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
    }
    @media (max-width: 560px) {
        #emoteBar { bottom: 168px; gap: 4px; }
        .emoteBtn { min-width: 42px; height: 34px; font-size: 11px; }
        #chatBar { bottom: 168px; }
    }
</style>
</head>
<body>
<div id="wrap">
    <div id="brand">Pixel Tank Duel</div>
    <div id="hud">
        <span id="timer">--</span>
        <span id="status"></span>
        <span id="series"></span>
        <span id="myBuff"></span>
    </div>
    <div id="banner"></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="help">Move/Aim: WASD / Arrows &nbsp;•&nbsp; Fire: Space &nbsp;•&nbsp; Emote: 1-7 &nbsp;•&nbsp; Chat: T &nbsp;•&nbsp; Scoreboard: Tab</div>
</div>
<div id="scoreboard" class="hidden">
    <div id="scoreCard">
        <h2 id="scoreTitle">Match</h2>
        <table>
            <thead>
                <tr><th></th><th>Callsign</th><th>W</th><th>K</th><th>D</th><th>DMG</th><th>ACC</th></tr>
            </thead>
            <tbody id="scoreBody"></tbody>
        </table>
        <p class="scoreHint">Hold Tab</p>
    </div>
</div>
<div id="moveStick" class="stick"><div class="knob"></div></div>
<div id="aimStick" class="stick"><div class="knob"></div></div>
<div id="fireBtn">Fire</div>
<div id="emoteBar"></div>
<div id="chatBar" class="hidden">
    <input id="chatInput" maxlength="40" placeholder="Talk smack..." autocomplete="off" spellcheck="false">
    <button id="chatSend">Send</button>
</div>
<button id="customizeBtn">Armory (G)</button>
<div id="garage">
    <div id="garageCard">
        <h1>Armory</h1>
        <p class="sub">Tank Configuration</p>
        <div id="garageBody">
            <canvas id="preview" width="180" height="180"></canvas>
            <div id="garageControls"></div>
        </div>
        <button id="garageDone">Deploy</button>
        <p id="garageError" class="hidden">Enter a callsign to deploy</p>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const seriesEl = document.getElementById('series');
const myBuffEl = document.getElementById('myBuff');
const bannerEl = document.getElementById('banner');
const scoreboardEl = document.getElementById('scoreboard');
const scoreTitleEl = document.getElementById('scoreTitle');
const scoreBodyEl = document.getElementById('scoreBody');

const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${location.host}`);

let myId = null;
let players = {};
let bullets = [];
let obstacles = [];
let holes = [];
let explosions = [];
let powerup = null;
let mapName = '';
let arena = { w: 800, h: 600 };
let roundInfo = { state: 'waiting', timeLeft: 0, winnerText: '' };
let matchInfo = { targetWins: 3, roundNumber: 0, over: false, winnerText: '' };
let powerupNext = null;
let roundActiveStart = 0; // performance.now() when the current round went active
let prevRoundState = 'waiting';

// ---- Trash talk ----
const EMOTES = [
    { key: '1', text: 'GG' },
    { key: '2', text: 'REKT' },
    { key: '3', text: 'NICE!' },
    { key: '4', text: 'LOL' },
    { key: '5', text: 'EZ' },
    { key: '6', text: 'OOPS' },
    { key: '7', text: 'HeHeHe...' },
];
const seenTaunts = {}; // playerId -> taunt.at already reacted to
const tauntAnims = {}; // playerId -> { start }
const seenBooms = new Set(); // explosion ids already reacted to
const boomAnims = {}; // explosion id -> { start, x, y, color, seed }
const lastHp = {}; // playerId -> last seen hp (to trigger the hit flash)
const hitFlash = {}; // playerId -> performance.now() of last damage
let chatOpen = false;

const POWERUP_META = {
    speed: { color: '#00e5ff', label: 'S', name: 'SPEED' },
    rapid: { color: '#ff9100', label: 'F', name: 'RAPID FIRE' },
    triple: { color: '#b388ff', label: 'T', name: 'TRIPLE SHOT' },
    ricochet: { color: '#ffd600', label: 'R', name: 'RICOCHET' },
    shield: { color: '#2979ff', label: 'B', name: 'SHIELD' },
    laser: { color: '#ff1744', label: 'L', name: 'LASER' },
};

// ---- Tank design (cosmetic) ----
const DEFAULT_DESIGN = { name: '', hull: 'classic', turret: 'square', barrel: 'medium', treads: 'treads', color: '#FF4136' };
const sanitizeName = (v) => String(v || '').replace(/[^\w -]/g, '').slice(0, 4);
const BARREL_LEN = { short: 10, medium: 18, long: 26 };
const PART_LABELS = { hull: 'Hull', turret: 'Turret', barrel: 'Barrel' };

let palette = [];
let parts = {};
let design = { ...DEFAULT_DESIGN };
try {
    const saved = JSON.parse(localStorage.getItem('tankDesign') || 'null');
    if (saved && typeof saved === 'object') Object.assign(design, saved);
} catch {}
design.treads = 'treads';
design.name = sanitizeName(design.name);

const garageEl = document.getElementById('garage');
const previewCtx = document.getElementById('preview').getContext('2d');
const garageControls = document.getElementById('garageControls');
const garageDoneEl = document.getElementById('garageDone');
const garageErrorEl = document.getElementById('garageError');
let nameInputEl = null;

// A callsign is required to deploy. Keep the hint visible while the field is
// empty and focus it on a blocked deploy so the fix is obvious.
function refreshDeployState() {
    if (design.name) garageErrorEl.classList.add('hidden');
    else garageErrorEl.classList.remove('hidden');
}
function openGarage() {
    garageEl.classList.remove('hidden');
    drawPreview();
    refreshDeployState();
    if (!design.name && nameInputEl) nameInputEl.focus();
}

function shade(hex, factor) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * factor);
    const g = Math.round(((n >> 8) & 255) * factor);
    const b = Math.round((n & 255) * factor);
    return `rgb(${r},${g},${b})`;
}

function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
}

function hullPath(g, shape) {
    if (shape === 'wedge') {
        g.beginPath();
        g.moveTo(-14, -11);
        g.lineTo(8, -11);
        g.lineTo(14, 0);
        g.lineTo(8, 11);
        g.lineTo(-14, 11);
        g.closePath();
    } else if (shape === 'round') {
        roundRect(g, -14, -11, 28, 22, 8);
    } else {
        roundRect(g, -14, -11, 28, 22, 4);
    }
}

function drawTank(g, d, turretOffset = 0) {
    const body = d.color;
    const dark = shade(body, 0.6);
    const mid = shade(body, 0.82);

    if (d.treads === 'treads') {
        for (const ty of [-15, 9]) {
            roundRect(g, -15, ty, 30, 6, 2.5);
            g.fillStyle = '#454d5c';
            g.fill();
            g.fillStyle = '#20242c';
            for (const tx of [-11, -6, -1, 4, 9]) g.fillRect(tx, ty + 1.5, 2, 3);
        }
    } else if (d.treads === 'wheels') {
        g.fillStyle = '#454d5c';
        for (const wx of [-10, 0, 10]) {
            g.beginPath(); g.arc(wx, -12.5, 3.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.arc(wx, 12.5, 3.5, 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = '#20242c';
        for (const wx of [-10, 0, 10]) {
            g.beginPath(); g.arc(wx, -12.5, 1.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.arc(wx, 12.5, 1.5, 0, Math.PI * 2); g.fill();
        }
    }

    g.save();
    hullPath(g, d.hull);
    if (d.hull === 'wedge') {
        g.strokeStyle = body;
        g.lineJoin = 'round';
        g.lineWidth = 4;
        g.stroke();
    }
    g.fillStyle = body;
    g.fill();
    hullPath(g, d.hull);
    g.clip();
    g.fillStyle = mid;
    g.fillRect(-15, -14, 30, 7);
    g.restore();

    // turret + barrel rotate independently of the hull
    g.save();
    g.rotate(turretOffset);
    g.fillStyle = dark;
    if (d.turret === 'round') {
        g.beginPath(); g.arc(1, 0, 8, 0, Math.PI * 2); g.fill();
    } else if (d.turret === 'dome') {
        g.beginPath(); g.arc(1, 0, 9, 0, Math.PI * 2); g.fill();
        g.fillStyle = mid;
        g.beginPath(); g.arc(1, 0, 5, 0, Math.PI * 2); g.fill();
    } else {
        roundRect(g, -5, -8, 14, 16, 3);
        g.fill();
    }

    const bl = BARREL_LEN[d.barrel] || BARREL_LEN.medium;
    g.fillStyle = dark;
    roundRect(g, 5, -3, bl, 6, 3);
    g.fill();
    g.fillStyle = mid;
    roundRect(g, 5, -3, bl, 2, 1);
    g.fill();
    g.fillStyle = '#111';
    roundRect(g, 5 + bl - 3, -4, 3, 8, 1.5);
    g.fill();
    g.restore();
}

// ---- Trash talk: audio ----
let audioCtx = null;
function ensureAudio() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { try { audioCtx = new AC(); } catch {} }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
['pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
    window.addEventListener(ev, ensureAudio, { passive: true })
);

function tone(freq, start, dur, type, peak) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak || 0.12, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.03);
}

function sweep(f0, f1, start, dur, type, peak) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(f0, start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), start + dur);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak || 0.12, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.03);
}

const EMOTE_SOUNDS = {
    GG: (t) => { tone(523, t, 0.1, 'triangle', 0.14); tone(784, t + 0.11, 0.16, 'triangle', 0.14); },
    REKT: (t) => { tone(330, t, 0.12, 'sawtooth', 0.12); tone(247, t + 0.12, 0.12, 'sawtooth', 0.12); tone(165, t + 0.24, 0.28, 'sawtooth', 0.12); },
    'NICE!': (t) => { tone(523, t, 0.09, 'square', 0.11); tone(659, t + 0.09, 0.09, 'square', 0.11); tone(880, t + 0.18, 0.18, 'square', 0.11); },
    LOL: (t) => { [0, 0.09, 0.18, 0.27].forEach((d, i) => tone(i % 2 ? 988 : 880, t + d, 0.07, 'square', 0.1)); },
    EZ: (t) => { tone(660, t, 0.14, 'triangle', 0.13); tone(440, t + 0.15, 0.22, 'triangle', 0.13); },
    OOPS: (t) => { sweep(600, 160, t, 0.4, 'sine', 0.14); },
    'HeHeHe...': (t) => {
        // high, wobbling cackle that slides down into a long "haaa"
        for (let i = 0; i < 11; i++) {
            const base = 900 - i * 16 + Math.sin(i * 1.9) * 70;
            const start = t + i * 0.1;
            tone(base, start, 0.055, 'triangle', 0.13);
            tone(base * 1.5, start + 0.006, 0.045, 'sawtooth', 0.05);
        }
        sweep(760, 300, t + 11 * 0.1, 0.34, 'triangle', 0.13);
    },
};

function playTauntSound(text) {
    ensureAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime + 0.01;
    const fn = EMOTE_SOUNDS[text];
    if (fn) { fn(t); return; }
    let hash = 0;
    for (let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
    const base = 380 + (hash % 7) * 90;
    tone(base, t, 0.09, 'square', 0.1);
    tone(base * 1.5, t + 0.09, 0.12, 'square', 0.1);
}

function playExplosionSound(seed) {
    ensureAudio();
    if (!audioCtx) return;
    const t = audioCtx.currentTime + 0.01;
    const dur = 0.55;
    // filtered noise burst = the crunch
    const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
        const env = Math.pow(1 - i / data.length, 2);
        data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = 0.9 + (seed % 5) * 0.05;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1600, t);
    filter.frequency.exponentialRampToValueAtTime(140, t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(g).connect(audioCtx.destination);
    src.start(t);
    // sub-bass thump underneath
    sweep(140 + (seed % 4) * 12, 38, t, 0.4, 'sine', 0.32);
}

// ---- Input state ----
const keys = {};
let inputDx = 0, inputDy = 0, inputFire = false;

window.addEventListener('keydown', (e) => { if (e.target && e.target.tagName === 'INPUT') return; keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function computeKeyboardVector() {
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    return { dx, dy };
}
let keyboardFire = false;
window.addEventListener('keydown', (e) => { if (e.target && e.target.tagName === 'INPUT') return; if (e.key === ' ') keyboardFire = true; });
window.addEventListener('keyup', (e) => { if (e.key === ' ') keyboardFire = false; });

// ---- Control mode + independent aim ----
let controlMode = localStorage.getItem('controlMode') || 'classic';
let mouseFire = false;
let mouseX = null, mouseY = null;
let aimTouchId = null, stickAim = 0, stickFiring = false;

function canvasPoint(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
        x: (clientX - r.left) * (canvas.width / r.width),
        y: (clientY - r.top) * (canvas.height / r.height),
    };
}
canvas.addEventListener('mousemove', (e) => {
    const pt = canvasPoint(e.clientX, e.clientY);
    mouseX = pt.x;
    mouseY = pt.y;
});
canvas.addEventListener('mousedown', (e) => { if (e.button === 0) mouseFire = true; });
window.addEventListener('mouseup', (e) => { if (e.button === 0) mouseFire = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('blur', () => { mouseFire = false; });

// ---- Touch controls (shown only on touch devices) ----
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const moveStick = document.getElementById('moveStick');
const knob = moveStick.querySelector('.knob');
const aimStick = document.getElementById('aimStick');
const aimKnob = aimStick.querySelector('.knob');
const fireBtn = document.getElementById('fireBtn');
let stickDx = 0, stickDy = 0, stickActive = false, stickTouchId = null;
let touchFire = false;

// Show/hide the touch controls for the active mode (twin-stick vs fire button).
function applyControlMode() {
    if (!isTouch) return;
    const aimMode = controlMode === 'aim';
    moveStick.style.display = 'block';
    aimStick.style.display = aimMode ? 'block' : 'none';
    fireBtn.style.display = aimMode ? 'none' : 'flex';
}

if (isTouch) {
    document.getElementById('help').style.display = 'none';
    applyControlMode();

    moveStick.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        stickTouchId = t.identifier;
        stickActive = true;
        updateStick(t);
    });
    moveStick.addEventListener('touchmove', (e) => {
        for (const t of e.changedTouches) {
            if (t.identifier === stickTouchId) updateStick(t);
        }
    });
    moveStick.addEventListener('touchend', resetStick);
    moveStick.addEventListener('touchcancel', resetStick);

    function updateStick(t) {
        const rect = moveStick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = (t.clientX - cx) / (rect.width / 2);
        let dy = (t.clientY - cy) / (rect.height / 2);
        const len = Math.hypot(dx, dy);
        if (len > 1) { dx /= len; dy /= len; }
        stickDx = dx; stickDy = dy;
        knob.style.left = `${36 + dx * 36}px`;
        knob.style.top = `${36 + dy * 36}px`;
    }
    function resetStick() {
        stickActive = false;
        stickTouchId = null;
        stickDx = 0; stickDy = 0;
        knob.style.left = '36px';
        knob.style.top = '36px';
    }

    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); touchFire = true; });
    fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); touchFire = false; });
    fireBtn.addEventListener('touchcancel', () => { touchFire = false; });

    // right stick: aim + auto-fire while held
    aimStick.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        aimTouchId = t.identifier;
        updateAimStick(t);
    });
    aimStick.addEventListener('touchmove', (e) => {
        for (const t of e.changedTouches) if (t.identifier === aimTouchId) updateAimStick(t);
    });
    aimStick.addEventListener('touchend', resetAimStick);
    aimStick.addEventListener('touchcancel', resetAimStick);

    function updateAimStick(t) {
        const rect = aimStick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = (t.clientX - cx) / (rect.width / 2);
        let dy = (t.clientY - cy) / (rect.height / 2);
        const len = Math.hypot(dx, dy);
        if (len < 0.25) {
            stickFiring = false;
            aimKnob.style.left = '36px';
            aimKnob.style.top = '36px';
            return;
        }
        if (len > 1) { dx /= len; dy /= len; }
        stickAim = Math.atan2(dy, dx);
        stickFiring = true;
        aimKnob.style.left = `${36 + dx * 36}px`;
        aimKnob.style.top = `${36 + dy * 36}px`;
    }
    function resetAimStick() {
        aimTouchId = null;
        stickFiring = false;
        aimKnob.style.left = '36px';
        aimKnob.style.top = '36px';
    }
}

// ---- Networking ----
ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'init') {
        myId = data.id;
        arena = data.arena;
        obstacles = data.obstacles;
        mapName = data.mapName || '';
        canvas.width = arena.w;
        canvas.height = arena.h;
        applyCatalog(data);
        sendDesign();
    } else if (data.type === 'full') {
        bannerEl.textContent = 'Game is full (4/4 players)';
    } else if (data.type === 'map') {
        obstacles = data.obstacles;
        mapName = data.name || mapName;
    } else if (data.type === 'state') {
        for (const id in data.players) {
            const tp = data.players[id].taunt;
            if (tp && seenTaunts[id] !== tp.at) {
                seenTaunts[id] = tp.at;
                tauntAnims[id] = { start: performance.now() };
                playTauntSound(tp.text);
            }
        }
        players = data.players;
        for (const id in players) {
            const prev = lastHp[id];
            if (prev !== undefined && players[id].hp < prev) hitFlash[id] = performance.now();
            lastHp[id] = players[id].hp;
        }
        bullets = data.bullets;
        holes = data.holes || [];
        explosions = data.explosions || [];
        for (const ex of explosions) {
            if (!seenBooms.has(ex.id)) {
                seenBooms.add(ex.id);
                boomAnims[ex.id] = { start: performance.now(), x: ex.x, y: ex.y, color: ex.color, seed: ex.id };
                playExplosionSound(ex.id);
            }
        }
        const liveBooms = new Set(explosions.map((e) => e.id));
        for (const id of seenBooms) if (!liveBooms.has(id)) seenBooms.delete(id);
        for (const id in boomAnims) if (!liveBooms.has(Number(id))) delete boomAnims[id];
        powerup = data.powerup;
        powerupNext = data.powerupNext || null;
        if (data.match) matchInfo = data.match;
        if (data.round.state === 'active' && prevRoundState !== 'active') roundActiveStart = performance.now();
        prevRoundState = data.round.state;
        roundInfo = data.round;
    }
};

setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) return;
    if (!garageEl.classList.contains('hidden') || chatOpen) {
        ws.send(JSON.stringify({ type: 'input', dx: 0, dy: 0, fire: false }));
        return;
    }
    const kb = computeKeyboardVector();
    const dx = kb.dx !== 0 ? kb.dx : stickDx;
    const dy = kb.dy !== 0 ? kb.dy : stickDy;
    let fire = keyboardFire || touchFire;
    let aim = null;
    if (controlMode === 'aim') {
        const mine = myId ? players[myId] : null;
        if (isTouch) {
            if (stickFiring) { aim = stickAim; fire = true; }
        } else if (mine && mouseX !== null) {
            aim = Math.atan2(mouseY - mine.y, mouseX - mine.x);
            fire = fire || mouseFire;
        }
    }
    const msg = { type: 'input', dx, dy, fire };
    if (aim !== null) msg.aim = aim;
    ws.send(JSON.stringify(msg));
}, 1000 / 30);

// ---- Rendering ----
function wrapText(g, text, maxW) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (g.measureText(test).width > maxW && line) { lines.push(line); line = word; }
        else line = test;
    }
    if (line) lines.push(line);
    return lines;
}

function drawTauntBubble(p, text, age) {
    ctx.save();
    ctx.font = 'bold 12px ui-monospace, monospace';
    const lines = wrapText(ctx, text, 130);
    const lineH = 15;
    let maxW = 0;
    for (const l of lines) maxW = Math.max(maxW, ctx.measureText(l).width);
    const w = maxW + 18;
    const h = lines.length * lineH + 12;
    const anchorX = Math.max(w / 2 + 6, Math.min(canvas.width - w / 2 - 6, p.x));
    const anchorY = p.y - 40 - h;
    const accent = p.design ? p.design.color : '#e0a938';

    // pop in, then a springy wobble for ~0.8s
    const appear = Math.min(1, age / 0.16);
    const overshoot = age < 0.16 ? 1.22 : 1;
    const scale = (0.35 + 0.65 * appear) * overshoot;
    const wob = age < 0.8 ? Math.sin(age * 26) * (1 - age / 0.8) * 0.14 : 0;

    ctx.translate(anchorX, anchorY + h); // pivot on the tail tip
    ctx.rotate(wob);
    ctx.scale(scale, scale);
    ctx.translate(0, -h); // origin now top-left of the bubble

    roundRect(ctx, 0, 0, w, h, 6);
    ctx.fillStyle = 'rgba(19,21,15,0.95)';
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(w / 2 - 6, h - 1);
    ctx.lineTo(w / 2 + 6, h - 1);
    ctx.lineTo(w / 2, h + 9);
    ctx.closePath();
    ctx.fillStyle = 'rgba(19,21,15,0.95)';
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = '#f0ecd8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], w / 2, 6 + lineH * i + lineH / 2);
    }
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
}

function drawHealthBar(x, topY, hp, maxHp) {
    const segW = 10;
    const gap = 2;
    const h = 5;
    const total = maxHp * segW + (maxHp - 1) * gap;
    const left = x - total / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    roundRect(ctx, left - 2, topY - 2, total + 4, h + 4, 2.5);
    ctx.fill();
    const fillColor = hp >= maxHp ? '#2ECC40' : hp === 1 ? '#c14b32' : '#e0a938';
    for (let i = 0; i < maxHp; i++) {
        const sx = left + i * (segW + gap);
        ctx.fillStyle = i < hp ? fillColor : 'rgba(255,255,255,0.13)';
        roundRect(ctx, sx, topY, segW, h, 1.5);
        ctx.fill();
    }
}

function mulberry32(a) {
    return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function drawExplosion(anim, age) {
    const p = Math.min(1, age / 0.9);
    const rnd = mulberry32((anim.seed * 2654435761) >>> 0);
    ctx.save();
    ctx.translate(anim.x, anim.y);

    // expanding shockwave ring
    ctx.beginPath();
    ctx.arc(0, 0, 8 + p * 54, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,214,120,${(1 - p) * 0.9})`;
    ctx.lineWidth = 3 * (1 - p) + 0.5;
    ctx.stroke();

    // fireball core
    const fbR = 20 * (1 - p * 0.55);
    if (fbR > 0.5) {
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, fbR);
        grad.addColorStop(0, `rgba(255,255,225,${(1 - p) * 0.95})`);
        grad.addColorStop(0.45, `rgba(255,168,58,${(1 - p) * 0.85})`);
        grad.addColorStop(1, 'rgba(180,40,20,0)');
        ctx.beginPath();
        ctx.arc(0, 0, fbR, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
    }

    // flying debris
    for (let i = 0; i < 12; i++) {
        const a = rnd() * Math.PI * 2;
        const spd = 40 + rnd() * 90;
        const life = 1 - age / (0.5 + rnd() * 0.4);
        const size = 2 + rnd() * 3;
        const spin = (2 + rnd() * 6) * (rnd() < 0.5 ? -1 : 1);
        const shadePick = i % 3;
        if (life <= 0) continue;
        ctx.save();
        ctx.translate(Math.cos(a) * spd * age, Math.sin(a) * spd * age + 90 * age * age);
        ctx.rotate(age * spin);
        ctx.globalAlpha = Math.max(0, life);
        ctx.fillStyle = shadePick === 0 ? '#2b2f22' : shadePick === 1 ? anim.color : '#c9c3aa';
        ctx.fillRect(-size / 2, -size / 2, size, size);
        ctx.restore();
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(127,138,82,0.07)';
    ctx.lineWidth = 1;
    const grid = 40;
    ctx.beginPath();
    for (let x = grid; x < canvas.width; x += grid) {
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, canvas.height);
    }
    for (let y = grid; y < canvas.height; y += grid) {
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(canvas.width, y + 0.5);
    }
    ctx.stroke();

    for (const o of obstacles) {
        roundRect(ctx, o.x, o.y, o.w, o.h, Math.min(4, o.w / 2, o.h / 2));
        ctx.fillStyle = '#242819';
        ctx.fill();
        ctx.strokeStyle = '#3b4129';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    if (holes.length) {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        for (const h of holes) {
            ctx.beginPath();
            ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    if (powerup) {
        const meta = POWERUP_META[powerup.type];
        const pulse = 3 * Math.sin(Date.now() / 150);
        ctx.beginPath();
        ctx.arc(powerup.x, powerup.y, 14 + pulse, 0, Math.PI * 2);
        ctx.fillStyle = meta.color;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#111';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(meta.label, powerup.x, powerup.y + 1);
        ctx.textBaseline = 'alphabetic';
    } else if (powerupNext) {
        // announced next spawn: a pulsing ring at the spot + a countdown
        const meta = POWERUP_META[powerupNext.type];
        const pulse = 2 * Math.sin(Date.now() / 140);
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = meta.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(powerupNext.x, powerupNext.y, 15 + pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = meta.color;
        ctx.font = 'bold 10px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(powerupNext.timeLeft / 1000) + 's', powerupNext.x, powerupNext.y - 22);
        ctx.restore();
    }

    for (const b of bullets) {
        if (b.laser) {
            const len = Math.hypot(b.vx, b.vy) || 1;
            const tx = b.x - (b.vx / len) * 26;
            const ty = b.y - (b.vy / len) * 26;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(255,23,68,0.35)';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            ctx.strokeStyle = '#ff1744';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            continue;
        }
        ctx.fillStyle = b.hot ? '#ffd600' : '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.hot ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
    }

    // Floor marker under your own tank (drawn before tanks so it sits on the ground)
    const mine = myId ? players[myId] : null;
    if (mine && mine.alive) {
        const accent = (mine.design && mine.design.color) || '#e0a938';
        const ringR = 24 + 2 * Math.sin(performance.now() / 260);
        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(mine.x, mine.y, ringR + 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = accent;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(mine.x, mine.y, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 0.3;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(mine.x, mine.y, ringR + 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // aim reticle (independent-aim mode only)
        if (controlMode === 'aim') {
            const aim = mine.aim || 0;
            const rx = mine.x + Math.cos(aim) * 62;
            const ry = mine.y + Math.sin(aim) * 62;
            ctx.save();
            ctx.globalAlpha = 0.55;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(rx, ry, 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(rx - 8, ry); ctx.lineTo(rx - 3, ry);
            ctx.moveTo(rx + 3, ry); ctx.lineTo(rx + 8, ry);
            ctx.moveTo(rx, ry - 8); ctx.lineTo(rx, ry - 3);
            ctx.moveTo(rx, ry + 3); ctx.lineTo(rx, ry + 8);
            ctx.stroke();
            ctx.restore();
        }
    }

    for (const id in players) {
        const p = players[id];
        if (!p.alive) continue;

        if (p.buff && p.buff.type === 'shield') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
            ctx.strokeStyle = '#2979ff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.7;
            ctx.stroke();
            ctx.fillStyle = '#2979ff';
            ctx.globalAlpha = 0.12;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        if (p.spawnProtected) {
            const pulse = 1.5 * Math.sin(performance.now() / 90);
            ctx.beginPath();
            ctx.arc(p.x, p.y, 20 + pulse, 0, Math.PI * 2);
            ctx.strokeStyle = '#e6f7ff';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.6;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        drawTank(ctx, p.design || DEFAULT_DESIGN, (p.aim || 0) - p.angle);
        ctx.restore();

        // brief white flash when this tank takes a hit
        const flashAge = hitFlash[id] ? performance.now() - hitFlash[id] : Infinity;
        if (flashAge < 160) {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.globalAlpha = 0.65 * (1 - flashAge / 160);
            ctx.fillStyle = '#fff';
            hullPath(ctx, (p.design || DEFAULT_DESIGN).hull);
            ctx.fill();
            ctx.restore();
        }

        drawHealthBar(p.x, p.y - 22, p.hp, p.maxHp || 3);

        const label = (p.design && p.design.name) || '';
        ctx.textAlign = 'center';
        if (label) {
            ctx.fillStyle = p.design.color;
            ctx.font = 'bold 11px ui-monospace, monospace';
            ctx.fillText(label, p.x, p.y - 34);
        }
        const starY = label ? p.y - 46 : p.y - 34;
        ctx.fillStyle = '#e0a938';
        ctx.font = '11px ui-monospace, monospace';
        ctx.fillText(`★${p.kills}`, p.x, starY);

        if (p.buff) {
            const meta = POWERUP_META[p.buff.type];
            ctx.beginPath();
            ctx.arc(p.x, starY - 12, 8, 0, Math.PI * 2);
            ctx.fillStyle = meta.color;
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.font = 'bold 9px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(meta.label, p.x, starY - 11);
            ctx.textBaseline = 'alphabetic';
        }

        if (p.taunt && tauntAnims[id]) {
            const age = (performance.now() - tauntAnims[id].start) / 1000;
            drawTauntBubble(p, p.taunt.text, age);
        }
    }

    // Round-start "find yourself" cue on your own tank, first 1.5s only
    if (mine && mine.alive && roundActiveStart) {
        const sinceStart = performance.now() - roundActiveStart;
        if (sinceStart < 1500) {
            const t = sinceStart / 1500;
            const accent = (mine.design && mine.design.color) || '#e0a938';
            ctx.save();
            ctx.globalAlpha = (1 - t) * 0.8;
            ctx.strokeStyle = accent;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mine.x, mine.y, 24 + t * 50, 0, Math.PI * 2);
            ctx.stroke();
            const ay = mine.y - 44 + Math.sin(performance.now() / 120) * 4 - t * 10;
            ctx.globalAlpha = (1 - t) * 0.95;
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.moveTo(mine.x - 9, ay);
            ctx.lineTo(mine.x + 9, ay);
            ctx.lineTo(mine.x, ay + 12);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }
    }

    for (const id in boomAnims) {
        const anim = boomAnims[id];
        drawExplosion(anim, (performance.now() - anim.start) / 1000);
    }

    requestAnimationFrame(draw);
}
draw();

// ---- HUD ----
setInterval(() => {
    const alive = Object.values(players).filter((p) => p.alive).length;
    const total = Object.keys(players).length;

    const mine = myId ? players[myId] : null;
    if (mine && mine.buff) {
        const meta = POWERUP_META[mine.buff.type];
        myBuffEl.textContent = `${meta.name} ${Math.ceil(mine.buff.timeLeft / 1000)}s`;
        myBuffEl.style.color = meta.color;
    } else {
        myBuffEl.textContent = '';
    }

    if (matchInfo.roundNumber > 0 || matchInfo.over) {
        seriesEl.textContent = matchInfo.over
            ? matchInfo.winnerText
            : `Round ${matchInfo.roundNumber} · first to ${matchInfo.targetWins}`;
    } else {
        seriesEl.textContent = `First to ${matchInfo.targetWins}`;
    }

    if (roundInfo.state === 'countdown') {
        timerEl.textContent = Math.ceil(roundInfo.countdownLeft / 1000) + 's';
        statusEl.textContent = 'Get ready';
        bannerEl.textContent = 'GET READY\n' + Math.ceil(roundInfo.countdownLeft / 1000);
    } else if (roundInfo.state === 'active') {
        timerEl.textContent = Math.ceil(roundInfo.timeLeft / 1000) + 's';
        statusEl.textContent = mapName ? `${mapName} · ${alive}/${total} alive` : `${alive}/${total} alive`;
        bannerEl.textContent = '';
    } else if (roundInfo.state === 'sudden') {
        timerEl.textContent = Math.ceil(roundInfo.timeLeft / 1000) + 's';
        statusEl.textContent = 'next kill wins';
        bannerEl.textContent = 'SUDDEN DEATH';
    } else if (roundInfo.state === 'ended') {
        timerEl.textContent = '';
        statusEl.textContent = '';
        bannerEl.textContent = matchInfo.over
            ? matchInfo.winnerText + '\nNew match soon...'
            : roundInfo.winnerText + '\nNext round soon...';
    } else {
        timerEl.textContent = '';
        statusEl.textContent = total < 2 ? 'Waiting for another player...' : '';
        bannerEl.textContent = total < 2 ? '' : '';
    }
}, 200);

// ---- Scoreboard (hold Tab) ----
function renderScoreboard() {
    const rows = Object.keys(players)
        .map((id) => ({ id, p: players[id] }))
        .sort((a, b) => (b.p.matchWins - a.p.matchWins) || (b.p.kills - a.p.kills) || (b.p.damage - a.p.damage));
    scoreTitleEl.textContent = matchInfo.over ? matchInfo.winnerText : `Match · first to ${matchInfo.targetWins}`;
    scoreBodyEl.innerHTML = '';
    for (const { id, p } of rows) {
        const tr = document.createElement('tr');
        if (id === myId) tr.className = 'me';
        else if (!p.alive) tr.className = 'out';
        const acc = p.shots > 0 ? Math.round((p.hits / p.shots) * 100) + '%' : '—';
        const cells = [
            `<span class="scoreSwatch" style="background:${(p.design && p.design.color) || '#888'}"></span>`,
            (p.design && p.design.name) || '—',
            p.matchWins || 0,
            p.kills || 0,
            p.deaths || 0,
            p.damage || 0,
            acc,
        ];
        for (const c of cells) {
            const td = document.createElement('td');
            td.innerHTML = c;
            tr.appendChild(td);
        }
        scoreBodyEl.appendChild(tr);
    }
}

function setScoreboard(show) {
    if (show) renderScoreboard();
    scoreboardEl.classList.toggle('hidden', !show);
}
window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'Tab') { e.preventDefault(); setScoreboard(true); }
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); setScoreboard(false); }
});
window.addEventListener('blur', () => setScoreboard(false));

</script>
</body>
