<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Tank Duel</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0;
        height: 100%;
        background: #0d0f14;
        color: #eee;
        font-family: -apple-system, system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
    }
    #wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #hud {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 24px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        z-index: 5;
    }
    #hud span { font-size: 15px; opacity: 0.85; }
    #timer { font-size: 20px; font-weight: 700; }
    #banner {
        position: absolute;
        top: 42%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(20px, 5vw, 36px);
        font-weight: 800;
        text-align: center;
        text-shadow: 0 2px 8px #000;
        z-index: 6;
        pointer-events: none;
    }
    canvas {
        background: #1a1d24;
        border: 2px solid #333;
        border-radius: 6px;
        max-width: 100vw;
        max-height: 100vh;
        touch-action: none;
    }
    .stick {
        position: fixed;
        bottom: 24px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        border: 2px solid rgba(255,255,255,0.2);
        z-index: 10;
        display: none;
    }
    .stick .knob {
        position: absolute;
        width: 50px;
        height: 50px;
        left: 35px;
        top: 35px;
        border-radius: 50%;
        background: rgba(255,255,255,0.35);
    }
    #moveStick { left: 24px; }
    #fireBtn {
        right: 24px;
        display: none;
        position: fixed;
        bottom: 24px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: rgba(255,60,60,0.25);
        border: 2px solid rgba(255,80,80,0.5);
        color: #fff;
        font-weight: 700;
        z-index: 10;
        align-items: center;
        justify-content: center;
        font-size: 14px;
    }
    #help {
        position: absolute;
        bottom: 8px;
        font-size: 12px;
        opacity: 0.5;
        z-index: 5;
    }
</style>
</head>
<body>
<div id="wrap">
    <div id="hud">
        <span id="timer">--</span>
        <span id="status"></span>
        <span id="myBuff"></span>
    </div>
    <div id="banner"></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="help">Move: WASD / Arrows &nbsp;•&nbsp; Fire: Space</div>
</div>
<div id="moveStick" class="stick"><div class="knob"></div></div>
<div id="fireBtn">FIRE</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const myBuffEl = document.getElementById('myBuff');
const bannerEl = document.getElementById('banner');

const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${location.host}`);

let myId = null;
let players = {};
let bullets = [];
let obstacles = [];
let powerup = null;
let arena = { w: 800, h: 600 };
let roundInfo = { state: 'waiting', timeLeft: 0, winnerText: '' };

const POWERUP_META = {
    speed: { color: '#00e5ff', label: 'S', name: 'SPEED' },
    rapid: { color: '#ff9100', label: 'F', name: 'RAPID FIRE' },
    triple: { color: '#b388ff', label: 'T', name: 'TRIPLE SHOT' },
    ricochet: { color: '#ffd600', label: 'R', name: 'RICOCHET' },
};

// ---- Input state ----
const keys = {};
let inputDx = 0, inputDy = 0, inputFire = false;

window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function computeKeyboardVector() {
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    return { dx, dy };
}
let keyboardFire = false;
window.addEventListener('keydown', (e) => { if (e.key === ' ') keyboardFire = true; });
window.addEventListener('keyup', (e) => { if (e.key === ' ') keyboardFire = false; });

// ---- Touch controls (shown only on touch devices) ----
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const moveStick = document.getElementById('moveStick');
const knob = moveStick.querySelector('.knob');
const fireBtn = document.getElementById('fireBtn');
let stickDx = 0, stickDy = 0, stickActive = false, stickTouchId = null;
let touchFire = false;

if (isTouch) {
    moveStick.style.display = 'block';
    fireBtn.style.display = 'flex';
    document.getElementById('help').style.display = 'none';

    moveStick.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        stickTouchId = t.identifier;
        stickActive = true;
        updateStick(t);
    });
    moveStick.addEventListener('touchmove', (e) => {
        for (const t of e.changedTouches) {
            if (t.identifier === stickTouchId) updateStick(t);
        }
    });
    moveStick.addEventListener('touchend', resetStick);
    moveStick.addEventListener('touchcancel', resetStick);

    function updateStick(t) {
        const rect = moveStick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = (t.clientX - cx) / (rect.width / 2);
        let dy = (t.clientY - cy) / (rect.height / 2);
        const len = Math.hypot(dx, dy);
        if (len > 1) { dx /= len; dy /= len; }
        stickDx = dx; stickDy = dy;
        knob.style.left = `${35 + dx * 35}px`;
        knob.style.top = `${35 + dy * 35}px`;
    }
    function resetStick() {
        stickActive = false;
        stickTouchId = null;
        stickDx = 0; stickDy = 0;
        knob.style.left = '35px';
        knob.style.top = '35px';
    }

    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); touchFire = true; });
    fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); touchFire = false; });
    fireBtn.addEventListener('touchcancel', () => { touchFire = false; });
}

// ---- Networking ----
ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'init') {
        myId = data.id;
        arena = data.arena;
        obstacles = data.obstacles;
        canvas.width = arena.w;
        canvas.height = arena.h;
    } else if (data.type === 'full') {
        bannerEl.textContent = 'Game is full (4/4 players)';
    } else if (data.type === 'state') {
        players = data.players;
        bullets = data.bullets;
        powerup = data.powerup;
        roundInfo = data.round;
    }
};

setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const kb = computeKeyboardVector();
    const dx = kb.dx !== 0 ? kb.dx : stickDx;
    const dy = kb.dy !== 0 ? kb.dy : stickDy;
    const fire = keyboardFire || touchFire;
    ws.send(JSON.stringify({ type: 'input', dx, dy, fire }));
}, 1000 / 30);

// ---- Rendering ----
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#2a2f3a';
    for (const o of obstacles) ctx.fillRect(o.x, o.y, o.w, o.h);

    if (powerup) {
        const meta = POWERUP_META[powerup.type];
        const pulse = 3 * Math.sin(Date.now() / 150);
        ctx.beginPath();
        ctx.arc(powerup.x, powerup.y, 14 + pulse, 0, Math.PI * 2);
        ctx.fillStyle = meta.color;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#111';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(meta.label, powerup.x, powerup.y + 1);
        ctx.textBaseline = 'alphabetic';
    }

    for (const b of bullets) {
        ctx.fillStyle = b.hot ? '#ffd600' : '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.hot ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
    }

    for (const id in players) {
        const p = players[id];
        if (!p.alive) continue;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        ctx.fillStyle = p.color;
        ctx.fillRect(-14, -11, 28, 22);
        ctx.fillStyle = '#111';
        ctx.fillRect(6, -3, 16, 6);

        if (id === myId) {
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(-14, -11, 28, 22);
        }
        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`★${p.kills}`, p.x, p.y - 22);

        if (p.buff) {
            const meta = POWERUP_META[p.buff.type];
            ctx.beginPath();
            ctx.arc(p.x, p.y - 34, 8, 0, Math.PI * 2);
            ctx.fillStyle = meta.color;
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.font = 'bold 9px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(meta.label, p.x, p.y - 33);
            ctx.textBaseline = 'alphabetic';
        }
    }

    requestAnimationFrame(draw);
}
draw();

// ---- HUD ----
setInterval(() => {
    const alive = Object.values(players).filter((p) => p.alive).length;
    const total = Object.keys(players).length;

    const mine = myId ? players[myId] : null;
    if (mine && mine.buff) {
        const meta = POWERUP_META[mine.buff.type];
        myBuffEl.textContent = `${meta.name} ${Math.ceil(mine.buff.timeLeft / 1000)}s`;
        myBuffEl.style.color = meta.color;
    } else {
        myBuffEl.textContent = '';
    }

    if (roundInfo.state === 'active') {
        timerEl.textContent = Math.ceil(roundInfo.timeLeft / 1000) + 's';
        statusEl.textContent = `${alive}/${total} alive`;
        bannerEl.textContent = '';
    } else if (roundInfo.state === 'ended') {
        timerEl.textContent = '';
        statusEl.textContent = '';
        bannerEl.textContent = roundInfo.winnerText + '\nNext round soon...';
    } else {
        timerEl.textContent = '';
        statusEl.textContent = total < 2 ? 'Waiting for another player...' : '';
        bannerEl.textContent = total < 2 ? '' : '';
    }
}, 200);
</script>
</body>
</html>
