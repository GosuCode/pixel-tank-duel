<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pixel Tank Duel</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0;
        height: 100%;
        background: #0d0f14;
        color: #eee;
        font-family: -apple-system, system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
    }
    #wrap {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #hud {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 24px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        z-index: 5;
    }
    #hud span { font-size: 15px; opacity: 0.85; }
    #timer { font-size: 20px; font-weight: 700; }
    #banner {
        position: absolute;
        top: 42%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(20px, 5vw, 36px);
        font-weight: 800;
        text-align: center;
        text-shadow: 0 2px 8px #000;
        z-index: 6;
        pointer-events: none;
    }
    canvas {
        background: #1a1d24;
        border: 2px solid #333;
        border-radius: 6px;
        max-width: 100vw;
        max-height: 100vh;
        touch-action: none;
    }
    .stick {
        position: fixed;
        bottom: 24px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        border: 2px solid rgba(255,255,255,0.2);
        z-index: 10;
        display: none;
    }
    .stick .knob {
        position: absolute;
        width: 50px;
        height: 50px;
        left: 35px;
        top: 35px;
        border-radius: 50%;
        background: rgba(255,255,255,0.35);
    }
    #moveStick { left: 24px; }
    #fireBtn {
        right: 24px;
        display: none;
        position: fixed;
        bottom: 24px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: rgba(255,60,60,0.25);
        border: 2px solid rgba(255,80,80,0.5);
        color: #fff;
        font-weight: 700;
        z-index: 10;
        align-items: center;
        justify-content: center;
        font-size: 14px;
    }
    #help {
        position: absolute;
        bottom: 8px;
        font-size: 12px;
        opacity: 0.5;
        z-index: 5;
    }
    #customizeBtn {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 20;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.2);
        color: #eee;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
    }
    #garage {
        position: fixed;
        inset: 0;
        background: rgba(6,8,12,0.92);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 16px;
    }
    #garage.hidden { display: none; }
    #garageCard {
        background: #151922;
        border: 2px solid #2c333f;
        border-radius: 12px;
        padding: 18px 20px 16px;
        width: min(560px, 100%);
        max-height: 100%;
        overflow-y: auto;
    }
    #garageCard h1 {
        margin: 0 0 14px;
        font-size: 18px;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-align: center;
    }
    #garageBody {
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
    }
    #preview {
        background: #1a1d24;
        border: 2px solid #2c333f;
        border-radius: 8px;
        flex: 0 0 auto;
    }
    #garageControls { flex: 1 1 240px; min-width: 0; }
    .garageRow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .garageLabel { width: 52px; flex: 0 0 auto; font-size: 12px; opacity: 0.6; text-transform: uppercase; }
    .garageOpts { display: flex; flex-wrap: wrap; gap: 6px; }
    .garageOpt {
        background: #222835;
        color: #cfd6e2;
        border: 1px solid #333c4b;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        text-transform: capitalize;
    }
    .garageOpt.selected { background: #2e7dff; border-color: #2e7dff; color: #fff; }
    .garageSwatch {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        border: 2px solid transparent;
        cursor: pointer;
        padding: 0;
    }
    .garageSwatch.selected { border-color: #fff; }
    #garageDone {
        display: block;
        margin: 16px auto 0;
        background: #2e7dff;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 34px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }
</style>
</head>
<body>
<div id="wrap">
    <div id="hud">
        <span id="timer">--</span>
        <span id="status"></span>
        <span id="myBuff"></span>
    </div>
    <div id="banner"></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="help">Move: WASD / Arrows &nbsp;•&nbsp; Fire: Space</div>
</div>
<div id="moveStick" class="stick"><div class="knob"></div></div>
<div id="fireBtn">FIRE</div>
<button id="customizeBtn">Customize (G)</button>
<div id="garage">
    <div id="garageCard">
        <h1>Customize Your Tank</h1>
        <div id="garageBody">
            <canvas id="preview" width="180" height="180"></canvas>
            <div id="garageControls"></div>
        </div>
        <button id="garageDone">Ready</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
const myBuffEl = document.getElementById('myBuff');
const bannerEl = document.getElementById('banner');

const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
const ws = new WebSocket(`${protocol}//${location.host}`);

let myId = null;
let players = {};
let bullets = [];
let obstacles = [];
let powerup = null;
let arena = { w: 800, h: 600 };
let roundInfo = { state: 'waiting', timeLeft: 0, winnerText: '' };

const POWERUP_META = {
    speed: { color: '#00e5ff', label: 'S', name: 'SPEED' },
    rapid: { color: '#ff9100', label: 'F', name: 'RAPID FIRE' },
    triple: { color: '#b388ff', label: 'T', name: 'TRIPLE SHOT' },
    ricochet: { color: '#ffd600', label: 'R', name: 'RICOCHET' },
    shield: { color: '#2979ff', label: 'B', name: 'SHIELD' },
};

// ---- Tank design (cosmetic) ----
const DEFAULT_DESIGN = { hull: 'classic', turret: 'square', barrel: 'medium', treads: 'treads', color: '#FF4136' };
const BARREL_LEN = { short: 10, medium: 18, long: 26 };
const PART_LABELS = { hull: 'Hull', turret: 'Turret', barrel: 'Barrel' };

let palette = [];
let parts = {};
let design = { ...DEFAULT_DESIGN };
try {
    const saved = JSON.parse(localStorage.getItem('tankDesign') || 'null');
    if (saved && typeof saved === 'object') Object.assign(design, saved);
} catch {}
design.treads = 'treads';

const garageEl = document.getElementById('garage');
const previewCtx = document.getElementById('preview').getContext('2d');
const garageControls = document.getElementById('garageControls');

function shade(hex, factor) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * factor);
    const g = Math.round(((n >> 8) & 255) * factor);
    const b = Math.round((n & 255) * factor);
    return `rgb(${r},${g},${b})`;
}

function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
}

function hullPath(g, shape) {
    if (shape === 'wedge') {
        g.beginPath();
        g.moveTo(-14, -11);
        g.lineTo(8, -11);
        g.lineTo(14, 0);
        g.lineTo(8, 11);
        g.lineTo(-14, 11);
        g.closePath();
    } else if (shape === 'round') {
        roundRect(g, -14, -11, 28, 22, 8);
    } else {
        roundRect(g, -14, -11, 28, 22, 4);
    }
}

function drawTank(g, d, highlight) {
    const body = d.color;
    const dark = shade(body, 0.6);
    const mid = shade(body, 0.82);

    if (d.treads === 'treads') {
        for (const ty of [-15, 9]) {
            roundRect(g, -15, ty, 30, 6, 2.5);
            g.fillStyle = '#454d5c';
            g.fill();
            g.fillStyle = '#20242c';
            for (const tx of [-11, -6, -1, 4, 9]) g.fillRect(tx, ty + 1.5, 2, 3);
        }
    } else if (d.treads === 'wheels') {
        g.fillStyle = '#454d5c';
        for (const wx of [-10, 0, 10]) {
            g.beginPath(); g.arc(wx, -12.5, 3.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.arc(wx, 12.5, 3.5, 0, Math.PI * 2); g.fill();
        }
        g.fillStyle = '#20242c';
        for (const wx of [-10, 0, 10]) {
            g.beginPath(); g.arc(wx, -12.5, 1.5, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.arc(wx, 12.5, 1.5, 0, Math.PI * 2); g.fill();
        }
    }

    g.save();
    hullPath(g, d.hull);
    if (d.hull === 'wedge') {
        g.strokeStyle = body;
        g.lineJoin = 'round';
        g.lineWidth = 4;
        g.stroke();
    }
    g.fillStyle = body;
    g.fill();
    hullPath(g, d.hull);
    g.clip();
    g.fillStyle = mid;
    g.fillRect(-15, -14, 30, 7);
    g.restore();

    g.fillStyle = dark;
    if (d.turret === 'round') {
        g.beginPath(); g.arc(1, 0, 8, 0, Math.PI * 2); g.fill();
    } else if (d.turret === 'dome') {
        g.beginPath(); g.arc(1, 0, 9, 0, Math.PI * 2); g.fill();
        g.fillStyle = mid;
        g.beginPath(); g.arc(1, 0, 5, 0, Math.PI * 2); g.fill();
    } else {
        roundRect(g, -5, -8, 14, 16, 3);
        g.fill();
    }

    const bl = BARREL_LEN[d.barrel] || BARREL_LEN.medium;
    g.fillStyle = dark;
    roundRect(g, 5, -3, bl, 6, 3);
    g.fill();
    g.fillStyle = mid;
    roundRect(g, 5, -3, bl, 2, 1);
    g.fill();
    g.fillStyle = '#111';
    roundRect(g, 5 + bl - 3, -4, 3, 8, 1.5);
    g.fill();

    if (highlight) {
        g.strokeStyle = '#fff';
        g.lineWidth = 2;
        g.lineJoin = 'round';
        hullPath(g, d.hull);
        g.stroke();
    }
}

function drawPreview() {
    const w = previewCtx.canvas.width;
    const h = previewCtx.canvas.height;
    previewCtx.clearRect(0, 0, w, h);
    previewCtx.save();
    previewCtx.translate(w / 2, h / 2);
    previewCtx.scale(2.6, 2.6);
    drawTank(previewCtx, design, false);
    previewCtx.restore();
}

function buildGarage() {
    garageControls.innerHTML = '';
    for (const key of Object.keys(PART_LABELS)) {
        const row = document.createElement('div');
        row.className = 'garageRow';
        const label = document.createElement('span');
        label.className = 'garageLabel';
        label.textContent = PART_LABELS[key];
        row.appendChild(label);
        const opts = document.createElement('div');
        opts.className = 'garageOpts';
        for (const opt of parts[key] || []) {
            const btn = document.createElement('button');
            btn.className = 'garageOpt' + (design[key] === opt ? ' selected' : '');
            btn.textContent = opt;
            btn.onclick = () => { design[key] = opt; buildGarage(); sendDesign(); };
            opts.appendChild(btn);
        }
        row.appendChild(opts);
        garageControls.appendChild(row);
    }

    const row = document.createElement('div');
    row.className = 'garageRow';
    const label = document.createElement('span');
    label.className = 'garageLabel';
    label.textContent = 'Color';
    row.appendChild(label);
    const opts = document.createElement('div');
    opts.className = 'garageOpts';
    for (const c of palette) {
        const btn = document.createElement('button');
        btn.className = 'garageSwatch' + (design.color === c.hex ? ' selected' : '');
        btn.style.background = c.hex;
        btn.title = c.name;
        btn.onclick = () => { design.color = c.hex; buildGarage(); sendDesign(); };
        opts.appendChild(btn);
    }
    row.appendChild(opts);
    garageControls.appendChild(row);
    drawPreview();
}

function applyCatalog(data) {
    palette = Array.isArray(data.palette) ? data.palette : [];
    parts = data.parts && typeof data.parts === 'object' ? data.parts : {};
    for (const key of Object.keys(PART_LABELS)) {
        if (!Array.isArray(parts[key]) || !parts[key].includes(design[key])) design[key] = DEFAULT_DESIGN[key];
    }
    if (!palette.some((c) => c.hex === design.color)) design.color = DEFAULT_DESIGN.color;
    buildGarage();
}

function sendDesign() {
    localStorage.setItem('tankDesign', JSON.stringify(design));
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'design', design }));
}

document.getElementById('garageDone').onclick = () => garageEl.classList.add('hidden');
document.getElementById('customizeBtn').onclick = () => { garageEl.classList.remove('hidden'); drawPreview(); };
window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'g') { garageEl.classList.remove('hidden'); drawPreview(); } });

// ---- Input state ----
const keys = {};
let inputDx = 0, inputDy = 0, inputFire = false;

window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function computeKeyboardVector() {
    let dx = 0, dy = 0;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    return { dx, dy };
}
let keyboardFire = false;
window.addEventListener('keydown', (e) => { if (e.key === ' ') keyboardFire = true; });
window.addEventListener('keyup', (e) => { if (e.key === ' ') keyboardFire = false; });

// ---- Touch controls (shown only on touch devices) ----
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const moveStick = document.getElementById('moveStick');
const knob = moveStick.querySelector('.knob');
const fireBtn = document.getElementById('fireBtn');
let stickDx = 0, stickDy = 0, stickActive = false, stickTouchId = null;
let touchFire = false;

if (isTouch) {
    moveStick.style.display = 'block';
    fireBtn.style.display = 'flex';
    document.getElementById('help').style.display = 'none';

    moveStick.addEventListener('touchstart', (e) => {
        const t = e.changedTouches[0];
        stickTouchId = t.identifier;
        stickActive = true;
        updateStick(t);
    });
    moveStick.addEventListener('touchmove', (e) => {
        for (const t of e.changedTouches) {
            if (t.identifier === stickTouchId) updateStick(t);
        }
    });
    moveStick.addEventListener('touchend', resetStick);
    moveStick.addEventListener('touchcancel', resetStick);

    function updateStick(t) {
        const rect = moveStick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = (t.clientX - cx) / (rect.width / 2);
        let dy = (t.clientY - cy) / (rect.height / 2);
        const len = Math.hypot(dx, dy);
        if (len > 1) { dx /= len; dy /= len; }
        stickDx = dx; stickDy = dy;
        knob.style.left = `${35 + dx * 35}px`;
        knob.style.top = `${35 + dy * 35}px`;
    }
    function resetStick() {
        stickActive = false;
        stickTouchId = null;
        stickDx = 0; stickDy = 0;
        knob.style.left = '35px';
        knob.style.top = '35px';
    }

    fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); touchFire = true; });
    fireBtn.addEventListener('touchend', (e) => { e.preventDefault(); touchFire = false; });
    fireBtn.addEventListener('touchcancel', () => { touchFire = false; });
}

// ---- Networking ----
ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'init') {
        myId = data.id;
        arena = data.arena;
        obstacles = data.obstacles;
        canvas.width = arena.w;
        canvas.height = arena.h;
        applyCatalog(data);
        sendDesign();
    } else if (data.type === 'full') {
        bannerEl.textContent = 'Game is full (4/4 players)';
    } else if (data.type === 'state') {
        players = data.players;
        bullets = data.bullets;
        powerup = data.powerup;
        roundInfo = data.round;
    }
};

setInterval(() => {
    if (ws.readyState !== WebSocket.OPEN) return;
    if (!garageEl.classList.contains('hidden')) {
        ws.send(JSON.stringify({ type: 'input', dx: 0, dy: 0, fire: false }));
        return;
    }
    const kb = computeKeyboardVector();
    const dx = kb.dx !== 0 ? kb.dx : stickDx;
    const dy = kb.dy !== 0 ? kb.dy : stickDy;
    const fire = keyboardFire || touchFire;
    ws.send(JSON.stringify({ type: 'input', dx, dy, fire }));
}, 1000 / 30);

// ---- Rendering ----
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#2a2f3a';
    for (const o of obstacles) {
        roundRect(ctx, o.x, o.y, o.w, o.h, Math.min(4, o.w / 2, o.h / 2));
        ctx.fill();
    }

    if (powerup) {
        const meta = POWERUP_META[powerup.type];
        const pulse = 3 * Math.sin(Date.now() / 150);
        ctx.beginPath();
        ctx.arc(powerup.x, powerup.y, 14 + pulse, 0, Math.PI * 2);
        ctx.fillStyle = meta.color;
        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#111';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(meta.label, powerup.x, powerup.y + 1);
        ctx.textBaseline = 'alphabetic';
    }

    for (const b of bullets) {
        ctx.fillStyle = b.hot ? '#ffd600' : '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.hot ? 5 : 4, 0, Math.PI * 2);
        ctx.fill();
    }

    for (const id in players) {
        const p = players[id];
        if (!p.alive) continue;

        if (p.buff && p.buff.type === 'shield') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
            ctx.strokeStyle = '#2979ff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.7;
            ctx.stroke();
            ctx.fillStyle = '#2979ff';
            ctx.globalAlpha = 0.12;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        drawTank(ctx, p.design || DEFAULT_DESIGN, id === myId);
        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`★${p.kills}`, p.x, p.y - 22);

        if (p.buff) {
            const meta = POWERUP_META[p.buff.type];
            ctx.beginPath();
            ctx.arc(p.x, p.y - 34, 8, 0, Math.PI * 2);
            ctx.fillStyle = meta.color;
            ctx.fill();
            ctx.fillStyle = '#111';
            ctx.font = 'bold 9px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(meta.label, p.x, p.y - 33);
            ctx.textBaseline = 'alphabetic';
        }
    }

    requestAnimationFrame(draw);
}
draw();

// ---- HUD ----
setInterval(() => {
    const alive = Object.values(players).filter((p) => p.alive).length;
    const total = Object.keys(players).length;

    const mine = myId ? players[myId] : null;
    if (mine && mine.buff) {
        const meta = POWERUP_META[mine.buff.type];
        myBuffEl.textContent = `${meta.name} ${Math.ceil(mine.buff.timeLeft / 1000)}s`;
        myBuffEl.style.color = meta.color;
    } else {
        myBuffEl.textContent = '';
    }

    if (roundInfo.state === 'active') {
        timerEl.textContent = Math.ceil(roundInfo.timeLeft / 1000) + 's';
        statusEl.textContent = `${alive}/${total} alive`;
        bannerEl.textContent = '';
    } else if (roundInfo.state === 'ended') {
        timerEl.textContent = '';
        statusEl.textContent = '';
        bannerEl.textContent = roundInfo.winnerText + '\nNext round soon...';
    } else {
        timerEl.textContent = '';
        statusEl.textContent = total < 2 ? 'Waiting for another player...' : '';
        bannerEl.textContent = total < 2 ? '' : '';
    }
}, 200);
</script>
</body>
</html>
